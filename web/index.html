<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSkills-VN 🍵 • Hỗ trợ học tập THPT & Trích xuất đề bài</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- React 18 & ReactDOM & Babel for zero-build execution -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Offline Static Skills & Books Bundle -->
  <script src="./skills-data.js"></script>

  <style>
    :root {
      --bg-cream: #F7F9F6;
      --bg-card: #FFFFFF;
      --bg-matcha-subtle: #EEF4EF;
      --bg-matcha-light: #DFECE2;
      
      --matcha-primary: #385E47;
      --matcha-dark: #22382B;
      --matcha-accent: #588B69;
      --matcha-leaf: #7DAA8B;
      
      --honey-warm: #E29578;
      --honey-light: #FFDDD2;
      --strawberry-milk: #F7CAD0;
      
      --text-main: #1D2D24;
      --text-muted: #5C7164;
      --text-light: #8E9F94;
      --border-color: #E2EAE4;
      --border-focus: #588B69;
      
      --shadow-soft: 0 8px 30px rgba(56, 94, 71, 0.06);
      --shadow-hover: 0 12px 36px rgba(56, 94, 71, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Top Navbar */
    .top-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-title-group h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .brand-title-group p {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--matcha-accent);
    }

    .version-tag {
      background: var(--honey-light);
      color: #9C4221;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }

    .nav-tabs-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-tab-btn {
      background: transparent;
      border: 1.5px solid transparent;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .nav-tab-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .nav-tab-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 12px rgba(56, 94, 71, 0.2);
    }

    .btn-guide-pill {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .btn-guide-pill:hover {
      background: #FFCAB9;
      transform: translateY(-2px);
    }

    /* Layout */
    .app-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      flex: 1;
    }

    .skills-workspace-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 992px) {
      .skills-workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Sidebar: Catalog */
    .catalog-sidebar {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 90px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .search-box-cute {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box-cute i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--matcha-leaf);
      font-size: 0.95rem;
    }

    .search-input-cute {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .search-input-cute:focus {
      border-color: var(--matcha-primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(88, 139, 105, 0.15);
    }

    /* Category Pills - Clean Wrapping, zero ugly scrollbar */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      background: var(--bg-cream);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 12px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .pill-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
    }

    /* Skills Scrollable List */
    .skills-scroll-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skills-scroll-list::-webkit-scrollbar {
      width: 5px;
    }
    .skills-scroll-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .skill-card-item {
      background: var(--bg-cream);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-card-item:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
      transform: translateX(3px);
    }

    .skill-card-item.active {
      background: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 16px rgba(56, 94, 71, 0.1);
    }

    .skill-card-info h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--matcha-dark);
      margin-bottom: 2px;
    }

    .skill-card-info p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--honey-warm);
      font-weight: 600;
    }

    .badge-mini {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .badge-science { background: #E8F5E9; color: #2E7D32; }
    .badge-social { background: #EDE7F6; color: #512DA8; }
    .badge-tech { background: #E1F5FE; color: #0288D1; }
    .badge-meta { background: #FFF3E0; color: #E65100; }

    /* Workstation */
    .aas-workstation {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-soft);
    }

    .workstation-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-back-catalog {
      background: none;
      border: none;
      color: var(--matcha-accent);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-back-catalog:hover {
      background: var(--bg-matcha-subtle);
    }

    .badge-tag-aas {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .workstation-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .workstation-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 20px;
    }

    /* Action Bar */
    .aas-action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1.5px solid var(--border-color);
      margin-bottom: 28px;
    }

    .btn-aas {
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary-aas {
      background: var(--matcha-primary);
      color: white;
      border: 1.5px solid var(--matcha-primary);
    }

    .btn-primary-aas:hover {
      background: var(--matcha-dark);
      border-color: var(--matcha-dark);
      transform: translateY(-2px);
    }

    .btn-outline-aas {
      background: white;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline-aas:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
    }

    .btn-honey-aas {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
    }

    .btn-honey-aas:hover {
      background: #FFCAB9;
    }

    /* SMART DROPZONE & MATH OCR SECTION */
    .smart-upload-container {
      background: #FAFBF9;
      border: 2px dashed var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 28px;
      transition: all 0.2s;
    }

    .smart-upload-container.drag-over {
      background: #E8F5E9;
      border-color: var(--matcha-primary);
    }

    .upload-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .upload-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-drop-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: white;
      border: 1.5px dashed var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .upload-drop-area:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-matcha-subtle);
    }

    .skill-sync-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-matcha-subtle);
      border: 1.5px solid #C8E6C9;
      border-radius: var(--radius-sm);
      padding: 9px 15px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--matcha-dark);
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #388E3C;
      box-shadow: 0 0 0 3px rgba(56, 142, 60, 0.2);
      animation: pulse-sync 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-sync {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 142, 60, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(56, 142, 60, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 142, 60, 0); }
    }

    .sync-badge {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--matcha-primary);
      background: white;
      border: 1px solid #C8E6C9;
      padding: 4px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .demo-buttons-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    .btn-demo-subject {
      background: white;
      border: 1px solid #C8E6C9;
      color: #2E7D32;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-demo-subject:hover {
      background: #E8F5E9;
      transform: translateY(-1px);
    }

    .ocr-paste-badge {
      background: #FFF3E0;
      border: 1px solid #FFE082;
      color: #E65100;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Image Preview & Extracted Math Verification Box */
    .math-verify-card {
      background: white;
      border: 1.5px solid #A5D6A7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 4px 16px rgba(46, 125, 50, 0.08);
    }

    .math-verify-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .math-verify-title {
      font-weight: 800;
      color: #1B5E20;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .image-preview-wrapper {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .image-preview-thumb {
      max-width: 140px;
      max-height: 100px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      object-fit: cover;
    }

    .btn-verify-math {
      background: #2E7D32;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-verify-math:hover {
      background: #1B5E20;
      transform: translateY(-2px);
    }

    .btn-clear-exercise {
      background: #FFEBEE;
      color: #C62828;
      border: 1.5px solid #FFCDD2;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-clear-exercise:hover {
      background: #FFCDD2;
      color: #B71C1C;
      transform: translateY(-1px);
    }

    /* Competency Tiers & Usage Context Styles */
    .tier-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tier-pill-card {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .tier-pill-card:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-matcha-subtle);
    }

    .tier-pill-card.active {
      border-color: var(--matcha-primary);
      background: #E8F5E9;
      box-shadow: 0 4px 12px rgba(56, 142, 60, 0.15);
    }

    .tier-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .tier-name {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .tier-badge-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--bg-matcha-light);
      color: var(--matcha-dark);
    }

    .tier-desc {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .context-selector-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-context-pill {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-context-pill:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-cream);
    }

    .btn-context-pill.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 2px 8px rgba(56, 94, 71, 0.2);
    }

    /* Prompt Export Modes Switcher */
    .prompt-mode-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 10px;
      width: fit-content;
      flex-wrap: wrap;
    }

    .btn-prompt-mode {
      background: transparent;
      border: none;
      color: #C8E6C9;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-prompt-mode.active {
      background: var(--matcha-primary);
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .btn-prompt-mode:hover:not(.active) {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* 5-Part Modern Prompt Builder Card */
    .prompt-builder-card {
      background: #FAFCF9;
      border: 2px solid var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(56, 94, 71, 0.05);
    }

    .builder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .builder-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;

    // Multi-Domain Educational Parser & Formatter (Offline Fallback & Client Utility)
    function formatMathProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '\\frac{$1}{$2}');
      text = text.replace(/([a-zA-Z0-9_]+)\/([a-zA-Z0-9_]+)/g, '\\frac{$1}{$2}');
      text = text.replace(/\^([0-9a-zA-Z\+\-]+)/g, '^{$1}');
      text = text.replace(/(?:sqrt|căn)\(([^)]+)\)/gi, '\\sqrt{$1}');
      text = text.replace(/(?:sqrt|căn)\s*([a-zA-Z0-9]+)/gi, '\\sqrt{$1}');
      text = text.replace(/lim\s*x\s*->\s*(\+?oo|\+?inf)/gi, '\\lim_{x \\to +\\infty}');
      text = text.replace(/lim\s*x\s*->\s*(-oo|-inf)/gi, '\\lim_{x \\to -\\infty}');
      text = text.replace(/vec\(([a-zA-Z]+)\)/gi, '\\vec{$1}');
      text = text.replace(/int_([0-9a-zA-Z]+)\^([0-9a-zA-Z]+)/g, '\\int_{$1}^{$2}');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatPhysicsProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\b(m\/s2|m\/s\^2)\b/g, '$\\text{m/s}^2$');
      text = text.replace(/\b(m\/s)\b/g, '$\\text{m/s}$');
      text = text.replace(/([0-9]+)\s*K\b/g, '$1\\text{ K}');
      text = text.replace(/([0-9]+)\s*oC\b/gi, '$1^\\circ\\text{C}');
      text = text.replace(/([0-9]+)\s*Pa\b/g, '$1\\text{ Pa}');
      text = text.replace(/([0-9]+)\s*atm\b/g, '$1\\text{ atm}');
      text = text.replace(/([0-9]+)\s*N\b/g, '$1\\text{ N}');
      text = text.replace(/([0-9]+)\s*J\b/g, '$1\\text{ J}');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatChemistryProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      const dict = [
        { vn: /axit\s+axetic/gi, iupac: 'ethanoic acid (acetic acid)' },
        { vn: /axit\s+sunfuric/gi, iupac: 'sulfuric acid (H2SO4)' },
        { vn: /axit\s+clohidric/gi, iupac: 'hydrochloric acid (HCl)' },
        { vn: /axit\s+nitric/gi, iupac: 'nitric acid (HNO3)' },
        { vn: /ancol\s+etylic/gi, iupac: 'ethanol (C2H5OH)' },
        { vn: /glucozo/gi, iupac: 'glucose (C6H12O6)' },
        { vn: /\bđồng\b/gi, iupac: 'copper (Cu)' },
        { vn: /\bsắt\b/gi, iupac: 'iron (Fe)' },
        { vn: /\bnhôm\b/gi, iupac: 'aluminium (Al)' },
        { vn: /\bnatri\b/gi, iupac: 'sodium (Na)' }
      ];
      dict.forEach(item => { text = text.replace(item.vn, item.iupac); });
      text = text.replace(/->|-->/g, ' $\\rightarrow$ ');
      text = text.replace(/Delta\s*r\s*H\s*0\s*298/gi, '$\\Delta_r H^0_{298}$');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

        function formatEnglishProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      const corrections = [
        { wrong: /\bacheive\b/gi, right: 'achieve' },
        { wrong: /\bacheivement\b/gi, right: 'achievement' },
        { wrong: /\bacheivements\b/gi, right: 'achievements' },
        { wrong: /\bacheived\b/gi, right: 'achieved' },
        { wrong: /\bacheiving\b/gi, right: 'achieving' },
        { wrong: /\bacheiver\b/gi, right: 'achiever' },
        { wrong: /\bacheivers\b/gi, right: 'achievers' },
        { wrong: /\brecieve\b/gi, right: 'receive' },
        { wrong: /\breciept\b/gi, right: 'receipt' },
        { wrong: /\bseperate\b/gi, right: 'separate' },
        { wrong: /\boccurance\b/gi, right: 'occurrence' },
        { wrong: /\bmaintainance\b/gi, right: 'maintenance' },
        { wrong: /\bpronounciation\b/gi, right: 'pronunciation' },
        { wrong: /\benviroment\b/gi, right: 'environment' },
        { wrong: /\baccomodate\b/gi, right: 'accommodate' },
        { wrong: /\bembarass\b/gi, right: 'embarrass' },
        { wrong: /\bdefinately\b/gi, right: 'definitely' },
        { wrong: /\bsuccessfull\b/gi, right: 'successful' },
        { wrong: /\bindependant\b/gi, right: 'independent' }
      ];
      corrections.forEach(item => { text = text.replace(item.wrong, item.right); });
      text = text.replace(/(^|\n)\s*([A-D])[\.\)]\s+/g, '$1**$2.** ');
      if (text.split(/\s+/).length <= 6 && !text.includes('**A.**') && !text.includes('\n')) {
        text += `\n\n[CHỈ THỊ SƯ PHẠM BẮT BUỘC]: Câu hỏi này về từ vựng / chuyển đổi từ loại (Word Formation). AI TUYỆT ĐỐI KHÔNG ĐƯỢC chỉ trả lời 1 từ đơn lẻ. Bắt buộc cung cấp:\n1. Bảng họ từ (Word Family: Verb - Noun - Adj - Adv).\n2. Phiên âm IPA Oxford chuẩn xác.\n3. Quy tắc chính tả (Spelling Rules) chống nhầm lẫn âm/chữ cái ("i before e except after c").\n4. Cụm từ cố định (Collocations) và câu ví dụ chuẩn SGK Global Success.`;
      }
      return text;
    }

    function formatLiteratureProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      if (!text.includes('PHẦN ĐỌC HIỂU')) {
        text = `### I. PHẦN ĐỌC HIỂU (4,0 điểm)\n\n**1. Ngữ liệu trích dẫn:**\n${text}\n\n**2. Hệ thống câu hỏi:**\n- **Câu 1:** Xác định thể thơ / phương thức biểu đạt chính.\n- **Câu 2:** Chỉ ra và nêu tác dụng của biện pháp tu từ nổi bật.\n- **Câu 3:** Rút ra bài học / thông điệp ý nghĩa nhất.\n\n### II. PHẦN LÀM VĂN (6,0 điểm)\n- **Câu 1 (2,0đ):** Viết đoạn văn nghị luận xã hội khoảng 200 chữ.\n- **Câu 2 (4,0đ):** Viết bài văn nghị luận phân tích sâu sắc ngữ liệu trên.`;

      return text;
    }

    function formatHistoryProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/(^|\n)\s*([A-D])[\.\)]\s+/g, '$1**$2.** ');
      if (text.split(/\s+/).length <= 10 && !text.includes('**A.**') && !text.includes('\n')) {
        text += `\n\n[CHỈ THỊ SƯ PHẠM BẮT BUỘC]: Câu hỏi lịch sử ngắn. AI TUYỆT ĐỐI KHÔNG ĐƯỢC chỉ trả lời 1 mốc năm hay 1 dòng trần trụi. Bắt buộc triển khai:\n1. Bối cảnh lịch sử và nguyên nhân sâu xa / trực tiếp.\n2. Diễn biến trọng tâm và tính chất bước ngoặt của sự kiện.\n3. Kết quả, Ý nghĩa lịch sử & Bài học kinh nghiệm đối với cách mạng Việt Nam.`;
      }
      return text;
    }

    function formatGeographyProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/(^|\n)\s*([A-D])[\.\)]\s+/g, '$1**$2.** ');
      text = text.replace(/\bta\/ha\b/gi, 'tạ/ha').replace(/\btan\/ha\b/gi, 'tấn/ha').replace(/\bkm2\b/gi, 'km²');
      if (text.split(/\s+/).length <= 10 && !text.includes('**A.**') && !text.includes('\n')) {
        text += `\n\n[CHỈ THỊ SƯ PHẠM BẮT BUỘC]: Câu hỏi địa lí định lượng/khái niệm ngắn. AI TUYỆT ĐỐI KHÔNG ĐƯỢC chỉ đưa ra con số trần trụi. Bắt buộc:\n1. Nêu rõ công thức địa lí định lượng và quy đổi đơn vị chuẩn trước khi tính.\n2. Thay số và tính toán từng bước, làm tròn chuẩn hàng thập phân.\n3. Rút ra nhận xét địa lí bản chất dựa trên số liệu vừa tính.`;
      }
      return text;
    }

    function formatLegalProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/(^|\n)\s*([A-D])[\.\)]\s+/g, '$1**$2.** ');
      if (text.split(/\s+/).length <= 10 && !text.includes('**A.**') && !text.includes('\n')) {
        text += `\n\n[CHỈ THỊ SƯ PHẠM BẮT BUỘC]: Câu hỏi KTPL ngắn. AI TUYỆT ĐỐI KHÔNG ĐƯỢC chỉ nêu 1 tên quyền hay 1 phán quyết cụt lủn. Bắt buộc:\n1. Phân tích Ma trận Chủ thể - Hành vi - Khách thể xâm phạm.\n2. Đối chiếu 4 hình thức thực hiện pháp luật (Sử dụng, Thi hành, Tuân thủ, Áp dụng).\n3. Kết luận căn cứ pháp lý và chế tài tương ứng theo quy định pháp luật.`;
      }
      return text;
    }

    function formatTechnologyProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/(^|\n)\s*([A-D])[\.\)]\s+/g, '$1**$2.** ');
      text = text.replace(/([0-9]+)\s*V\b/g, '$1 V').replace(/([0-9]+)\s*Hz\b/g, '$1 Hz').replace(/([0-9]+)\s*kW\b/g, '$1 kW');
      if (text.split(/\s+/).length <= 10 && !text.includes('**A.**') && !text.includes('\n')) {
        text += `\n\n[CHỈ THỊ SƯ PHẠM BẮT BUỘC]: Câu hỏi kỹ thuật ngắn. AI TUYỆT ĐỐI KHÔNG ĐƯỢC trả lời cụt lủn 1 dòng. Bắt buộc:\n1. Trình bày sơ đồ khối chức năng và nguyên lý biến đổi năng lượng/tín hiệu.\n2. Phân tích các thông số kỹ thuật định mức và quy trình công nghệ.\n3. Nêu các biện pháp an toàn kỹ thuật lao động bắt buộc.`;
      }
      return text;
    }

    function formatInformaticsProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\bO\(n\^2\)/g, '$O(n^2)$');
      text = text.replace(/\bO\(n\s*log\s*n\)/gi, '$O(n \\log n)$');
      text = text.replace(/\bO\(log\s*n\)/gi, '$O(\\log n)$');
      text = text.replace(/\bO\(n\)/g, '$O(n)$');
      text = text.replace(/\bO\(1\)/g, '$O(1)$');
      return text;
    }

    function formatBiologyProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/([0-9]+)\s*Angstrom\b/gi, '$1\\text{ \\AA}');
      text = text.replace(/([0-9]+)\s*nm\b/gi, '$1\\text{ nm}');
      text = text.replace(/\bDelta\s*L\b/gi, '$\\Delta L$');
      text = text.replace(/(^|\n)\s*([A-D])[\.\)]\s+/g, '$1**$2.** ');
      return text;
    }

    function formatProblemBySubject(rawText, subject) {
      if (!rawText) return { formatted: '', badge: '' };
      const config = SKILL_PRESET_CONFIGS[subject] || SKILL_PRESET_CONFIGS['toan-thpt'];
      switch (subject) {
        case 'toan-thpt':
        case 'giai-chi-tiet':
          return { formatted: formatMathProblem(rawText), badge: config.domainBadge };
        case 'vat-li-thpt':
          return { formatted: formatPhysicsProblem(rawText), badge: config.domainBadge };
        case 'hoa-hoc-thpt':
          return { formatted: formatChemistryProblem(rawText), badge: config.domainBadge };
        case 'sinh-hoc-thpt':
          return { formatted: formatBiologyProblem(rawText), badge: config.domainBadge };
        case 'ngu-van-thpt':
          return { formatted: formatLiteratureProblem(rawText), badge: config.domainBadge };
        case 'tieng-anh-thpt':
          return { formatted: formatEnglishProblem(rawText), badge: config.domainBadge };
        case 'tin-hoc-thpt':
          return { formatted: formatInformaticsProblem(rawText), badge: config.domainBadge };
        case 'lich-su-thpt':
          return { formatted: formatHistoryProblem(rawText), badge: config.domainBadge };
        case 'dia-li-thpt':
          return { formatted: formatGeographyProblem(rawText), badge: config.domainBadge };
        case 'ktpl-thpt':
          return { formatted: formatLegalProblem(rawText), badge: config.domainBadge };
        case 'cong-nghe-thpt':
          return { formatted: formatTechnologyProblem(rawText), badge: config.domainBadge };
        default:
          return { formatted: rawText.trim(), badge: config.domainBadge };
      }
    }

        p += `\n## 🔄 3. QUY TRÌNH TƯ DUY BỘ MÔN & KHUNG GIÀN GIÁO 4 TẦNG SOCRATES\n`;
        p += `- **Cơ chế kích hoạt nhận thức bắt buộc:**\n`;
        if (useCoT) p += `  * **[First-Principles Chain-of-Thought]:** Suy luận từ định nghĩa, tiên đề và định luật gốc; chứng minh tường minh mọi bước biến đổi trước khi kết luận.\n`;
        if (useSocratic) p += `  * **[Socratic Scaffolding]:** Khơi mở tư duy bằng câu hỏi định hướng ở Tầng 1 trước khi đi vào lời giải chi tiết.\n`;
        if (useActiveRecall) p += `  * **[Active Recall & Transfer]:** Kết thúc bằng 01 câu hỏi phản biện hoặc bài tập tương tự để học sinh tự kiểm chứng.\n`;
        p += `- **Chuỗi thao tác tư duy chuyên ngành (@${selectedSkillId}):**\n`;
        skillProfile.methodologySteps.forEach((step) => {
          p += `  * ${step}\n`;
        });

        p += `\n## ⚠️ 4. MA TRẬN BẪY NHẬN THỨC & SAI LẦM PHÒNG THI CẦN CẢNH BÁO (@${selectedSkillId})\n`;
        skillProfile.traps.forEach((trap, idx) => {
          p += `  ${idx + 1}. **Bẫy #${idx + 1}:** ${trap}\n`;
        });

        p += `\n## 📖 5. DẪN CHỨNG HỌC LIỆU & TRUNG THỰC NHẬN THỨC (EPISTEMIC GROUNDING)\n`;
        p += `- **Sách Giáo Khoa chuẩn tham chiếu:** ${bookTitle}\n`;
        p += `- **Mã học liệu chuẩn:** \`${bookFile}\` (Kho lưu trữ: ${bookDrive})\n`;
        p += `- **GIAO THỨC TRUNG THỰC NHẬN THỨC (EPISTEMIC HONESTY PROTOCOL):**\n`;
        p += `  1. Chỉ sử dụng định nghĩa, ký hiệu, công thức và phương pháp nằm trong phạm vi Chương trình GDPT 2018 của cuốn **${bookTitle}**.\n`;
        p += `  2. **Chống ảo giác trích dẫn (Zero Fake-Citation):** Tuyệt đối KHÔNG tự bịa đặt số trang hoặc số dòng cụ thể trong SGK nếu không có trong ngữ liệu đính kèm; chỉ trích dẫn đến cấp **Chương / Chuyên đề / Tên định lý**.\n`;

        p += `\n## 🛡️ 6. MẪU NEO CHẤT LƯỢNG (FEW-SHOT EXEMPLAR) & GIAO THỨC TỰ KIỂM CHỨNG (CoVe)\n`;
        if (useFewShot && skillProfile.fewShot) {
          p += `### 6.1. Mẫu Neo Chất Lượng Chuẩn Mực (Dynamic Few-Shot Exemplar cho @${selectedSkillId}):\n`;
          p += `> **Đầu vào mẫu:** ${skillProfile.fewShot.input}\n`;
          p += `> **Chuẩn phân tích & đầu ra mẫu:**\n`;
          String(skillProfile.fewShot.output || '').split('\n').forEach(line => {
            p += `> ${line}\n`;
          });
          p += `\n`;
        }
        p += `### 6.2. Danh sách Tự Kiểm Chứng Đa Chiều (Chain-of-Verification - CoVe Checklist):\n`;
        skillProfile.coveChecklist.forEach((check, idx) => {
          p += `- **[CoVe Check #${idx + 1}]:** ${check}\n`;
        });
        p += `- **[Ràng buộc định dạng]:** ${constraintsPrompt}.\n`;

        if (docAttachment.trim()) {
          p += `\n## 📝 7. NỘI DUNG ĐỀ BÀI / NGỮ LIỆU ĐẦU VÀO ĐÃ XÁC NHẬN KIỂM CHỨNG\n`;
          p += `\`\`\`text\n${docAttachment.trim()}\n\`\`\`\n\n`;
          p += `👉 **LỆNH THỰC THI BẮT BUỘC ĐỐI VỚI AI:**\n`;
          p += `${getDomainExecutionMandates(selectedSkillId)}\n`;
          p += `4. Hãy bắt đầu giải quyết bài toán/đề bài theo trọn vẹn 4 tầng sư phạm:`;
        } else {
          p += `\n## 📝 7. CHẾ ĐỘ KHỞI TẠO ĐỀ BÀI & GIẢNG DẠY TỰ ĐỘNG (AUTONOMOUS PEDAGOGICAL MODE)\n`;
          p += `- **Trạng thái đầu vào:** Người dùng chưa đính kèm đề bài cụ thể.\n`;
          p += `- **Đề bài chuẩn khởi tạo gợi ý (Lớp ${gradeLevel} - ${tierObj.name}):**\n`;
          p += `  > *"${skillProfile.sampleProblem}"*\n`;
          p += `- **LỆNH THỰC THI:** Hãy sử dụng ngay đề bài chuẩn trên (hoặc khởi tạo 01 đề bài tương đương sát với SGK **"${bookTitle}"** ở cấp độ **"${tierObj.name}"**) và triển khai giảng dạy trọn vẹn theo 4 tầng Socrates.\n`;
          p += `- **CHỈ THỊ SƯ PHẠM BỘ MÔN BẮT BUỘC:**\n${getDomainExecutionMandates(selectedSkillId)}`;
        }

        return p;
      }, [rolePrompt, gradeLevel, studentLevel, currentStatus, taskPrompt, constraintsPrompt, useCoT, useSocratic, useFewShot, useActiveRecall, currentBookObject, docAttachment, competencyTier, usageContext, promptExportMode, selectedSkillId, selectedSkill]);

      // --- Handle File & Image Upload with OCR Backend ---
      const processFile = (file, customName) => {
        if (!file) return;
        setUploadedFile(file);
        setIsOcrLoading(true);

        const fileName = customName || file.name || 'de-bai-tap.png';

        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const dataUrl = e.target.result;
            setImagePreview(dataUrl);

            // Gửi lên Backend /api/ocr
            try {
              const res = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  image: dataUrl,
                  subject: selectedSkillId,
                  grade: gradeLevel,
                  fileName: fileName,
                  fileType: file.type
                })
              });
              const data = await res.json();
              if (data.success && data.formattedText) {
                setExtractedMathText(data.formattedText);
                setDetectedBadge(data.domainBadge || currentPreset.domainBadge);
                setOcrInfo({
                  isRealOcr: data.isRealOcr,
                  confidence: data.ocrConfidence,
                  scanDurationMs: data.scanDurationMs,
                  engine: data.ocrEngine
                });
                triggerToast(`⚡ Đã quét chữ thành công (${data.ocrConfidence}% tin cậy, ${data.scanDurationMs || 0}ms)! 🐾`);
              } else {
                throw new Error('Fallback offline parser');
              }
            } catch (err) {
              // Fallback client-side parser
              const clientResult = formatProblemBySubject(
                `Cho bài tập nhận diện từ ảnh "${fileName}".\n1. Xác định điều kiện và viết công thức toán/hóa/lý.\n2. Giải chi tiết từng bước.`,
                selectedSkillId
              );
              setExtractedMathText(clientResult.formatted);
              setDetectedBadge(clientResult.badge || currentPreset.domainBadge);
              setOcrInfo({
                isRealOcr: false,
                confidence: 80,
                scanDurationMs: 0,
                engine: 'Heuristic Offline Parser'
              });
              triggerToast(`Đã nhận diện ảnh đề bài "${fileName}" (Offline mode)! 📷🐾`);
            } finally {
              setIsOcrLoading(false);
            }
          };
          reader.readAsDataURL(file);
        } else {
          // Document / Text / PDF
          setImagePreview('');
          const reader = new FileReader();
          reader.onload = async (e) => {
            const rawContent = e.target.result;
            try {
              const res = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: rawContent,
                  subject: selectedSkillId,
                  grade: gradeLevel,
                  fileName: fileName,
                  fileType: file.type
                })
              });
              const data = await res.json();
              if (data.success && data.formattedText) {
                setExtractedMathText(data.formattedText);
                setDetectedBadge(data.domainBadge || currentPreset.domainBadge);
                setOcrInfo({
                  isRealOcr: false,
                  confidence: 100,
                  scanDurationMs: 0,
                  engine: 'PDF & Document Parser'
                });
                triggerToast(`⚡ Đã phân tích tài liệu "${fileName}" qua OCR Backend! 📄`);
              } else {
                throw new Error('Fallback offline parser');
              }
            } catch (err) {
              const clientResult = formatProblemBySubject(rawContent, selectedSkillId);
              setExtractedMathText(clientResult.formatted);
              setDetectedBadge(clientResult.badge || currentPreset.domainBadge);
              triggerToast(`Đã đọc nội dung tài liệu "${fileName}"! 📄`);
            } finally {
              setIsOcrLoading(false);
            }
          };
          reader.readAsText(file);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      // Transfer verified exercise into Prompt
      const applyVerifiedMathToPrompt = () => {
        if (!extractedMathText.trim()) return;
        setDocAttachment(extractedMathText.trim());
        triggerToast('Đã xác nhận & nạp đề bài vào Prompt Sư Phạm! ✅');
      };

      // Nạp đề mẫu theo đúng kỹ năng đang chọn (Không gây mâu thuẫn)
      const loadPresetSample = (sample) => {
        setExtractedMathText(sample.content);
        setDocAttachment(sample.content);
        setDetectedBadge(currentPreset.domainBadge);
        triggerToast(`Đã nạp đề mẫu: ${sample.title}! ✨🐾`);
      };

      // --- Offline Downloads & Copies ---
      const handleDownloadSkillMd = () => {
        try {
          const content = selectedSkill.rawContent || `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${selectedSkill.id || 'skill'}.SKILL.md`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          triggerToast(`Đã tải file ${selectedSkill.id}.SKILL.md về máy! 💾🐾`);
        } catch (e) {
          triggerToast(`Lỗi: ${e.message}`);
        }
      };

      const handleCopyPromptPayload = async () => {
        try {
          await navigator.clipboard.writeText(generatedPromptPayload);
          triggerToast(`Đã sao chép Prompt chuẩn Tieuchuanprompt.md! 📋✨`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      const handleCopyFullContent = async () => {
        try {
          let text = selectedSkill.rawContent || '';
          if (!text) {
            text = `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          } else {
            text += `\n\n========================================\n[PROMPT SƯ PHẠM ĐÍNH KÈM TỪ EDUSKILLS-VN]:\n${generatedPromptPayload}\n========================================\n`;
          }
          await navigator.clipboard.writeText(text);
          triggerToast(`Đã sao chép toàn bộ Master Playbook ${selectedSkill.id}.SKILL.md! 🍵`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      return (
        <div>
          {/* Top Navbar */}
          <header className="top-navbar">
            <div className="brand-section" onClick={() => setActiveTab('skills')}>
              <svg className="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="#588B69" />
                <path d="M28 35L36 18L44 32" fill="#E29578" />
                <path d="M72 35L64 18L56 32" fill="#E29578" />
                <circle cx="50" cy="52" r="32" fill="#FFFFFF" />
                <ellipse cx="40" cy="48" rx="4" ry="5" fill="#22382B" />
                <ellipse cx="60" cy="48" rx="4" ry="5" fill="#22382B" />
                <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF" />
                <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF" />
                <path d="M48 54L52 54L50 57Z" fill="#E29578" />
                <path d="M46 59C48 61 52 61 54 59" stroke="#22382B" strokeWidth="2" strokeLinecap="round" />
                <ellipse cx="33" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <ellipse cx="67" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <path d="M38 72H62C62 72 60 84 50 84C40 84 38 72 38 72Z" fill="#385E47" />
                <ellipse cx="50" cy="72" rx="12" ry="3" fill="#7DAA8B" />
              </svg>
              <div className="brand-title-group">
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <h1>EduSkills-VN</h1>
                  <span className="version-tag">v2.0.0</span>
                </div>
                <p>Matcha Mèo Ú • Hỗ trợ học tập THPT & Trích xuất đề bài</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="nav-tabs-group">
              <button 
                className={`nav-tab-btn ${activeTab === 'skills' ? 'active' : ''}`}
                onClick={() => setActiveTab('skills')}
              >
                <i className="fa-solid fa-graduation-cap"></i> Danh sách kỹ năng
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'drive' ? 'active' : ''}`}
                onClick={() => setActiveTab('drive')}
              >
                <i className="fa-brands fa-google-drive"></i> Tủ sách giáo khoa
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'prompt-standard' ? 'active' : ''}`}
                onClick={() => setActiveTab('prompt-standard')}
              >
                <i className="fa-solid fa-scroll"></i> Cấu trúc prompt
              </button>
              <button 
                className="btn-guide-pill"
                onClick={() => setShowGuideModal(true)}
              >
                <i className="fa-solid fa-circle-question"></i> Hướng dẫn
              </button>
            </div>
          </header>

          {/* Main App Container */}
          <main className="app-container">
            {/* VIEW 1: SKILLS & WORKSTATION */}
            {activeTab === 'skills' && (
              <div className="skills-workspace-grid">
                {/* Left: Sidebar Catalog */}
                <aside className="catalog-sidebar">
                  <div className="search-box-cute">
                    <i className="fa-solid fa-magnifying-glass"></i>
                    <input 
                      type="text" 
                      className="search-input-cute" 
                      placeholder="Tìm môn học hoặc kỹ năng..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>

                  {/* Category Pills - Clean Wrapping */}
                  <div className="category-pills">
                    {[
                      { id: 'all', label: 'Tất cả (16)' },
                      { id: 'khoa-hoc-tu-nhien', label: 'Tự nhiên' },
                      { id: 'khoa-hoc-xa-hoi', label: 'Xã hội' },
                      { id: 'ngon-ngu-cong-nghe', label: 'Công nghệ' },
                      { id: 'meta-tools', label: 'Công cụ' }
                    ].map(cat => (
                      <button 
                        key={cat.id} 
                        className={`pill-btn ${selectedCategory === cat.id ? 'active' : ''}`}
                        onClick={() => setSelectedCategory(cat.id)}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>

                  {/* Skills Scrollable List */}
                  <div className="skills-scroll-list">
                    {filteredSkills.map(skill => {
                      const isSelected = skill.id === selectedSkill.id;
                      const isFav = !!shortlist[skill.id];
                      return (
                        <div 
                          key={skill.id} 
                          className={`skill-card-item ${isSelected ? 'active' : ''}`}
                          onClick={() => setSelectedSkillId(skill.id)}
                        >
                          <div className="skill-card-info">
                            <h4>{skill.name}</h4>
                            <p>@{skill.id} {isFav ? '💖' : ''}</p>
                          </div>
                          <span className={`badge-mini ${
                            skill.category === 'khoa-hoc-tu-nhien' ? 'badge-science' :
                            skill.category === 'khoa-hoc-xa-hoi' ? 'badge-social' :
                            skill.category === 'ngon-ngu-cong-nghe' ? 'badge-tech' : 'badge-meta'
                          }`}>
                            {skill.category ? skill.category.split('-')[0].toUpperCase() : 'SKILL'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </aside>

                {/* Right: AAS Core Workstation */}
                <section className="aas-workstation">
                  <div className="workstation-breadcrumb">
                    <button className="btn-back-catalog" onClick={() => setSelectedCategory('all')}>
                      <i className="fa-solid fa-arrow-left"></i> Danh mục kỹ năng
                    </button>
                    <span className="badge-tag-aas badge-science">
                      {selectedSkill.category || 'AAS CORE'}
                    </span>
                    <span className="badge-tag-aas badge-meta">
                      v0.1.2-beta
                    </span>
                    <span className="badge-tag-aas badge-tech">
                      GDPT 2018 • BGD 2026
                    </span>
                  </div>

                  <div className="workstation-header">
                    <div className="workstation-title">
                      @{selectedSkill.id}
                      {shortlist[selectedSkill.id] && <span style={{ fontSize: '1.4rem' }}>💖</span>}
                    </div>
                    <p className="workstation-desc">{selectedSkill.description}</p>
                  </div>

                  {/* Action Bar */}
                  <div className="aas-action-bar">
                    <button className="btn-aas btn-primary-aas" onClick={handleDownloadSkillMd}>
                      <i className="fa-solid fa-download"></i> Tải về (.md)
                    </button>
                    <button 
                      className={`btn-aas ${shortlist[selectedSkill.id] ? 'btn-honey-aas' : 'btn-outline-aas'}`}
                      onClick={() => {
                        const id = selectedSkill.id;
                        const next = { ...shortlist, [id]: !shortlist[id] };
                        setShortlist(next);
                        try { localStorage.setItem('eduskills_shortlist', JSON.stringify(next)); } catch (e) {}
                        triggerToast(next[id] ? `Đã lưu @${id} vào danh sách.` : `Đã bỏ khỏi danh sách.`);
                      }}
                    >
                      <i className={`fa-${shortlist[selectedSkill.id] ? 'solid' : 'regular'} fa-bookmark`}></i>
                      {shortlist[selectedSkill.id] ? 'Đã lưu' : 'Lưu kỹ năng'}
                    </button>
                    <button className="btn-aas btn-outline-aas" onClick={handleCopyPromptPayload}>
                      <i className="fa-solid fa-clipboard-check"></i> Sao chép prompt
                    </button>
                    <button className="btn-aas btn-outline-aas" onClick={handleCopyFullContent}>
                      <i className="fa-solid fa-copy"></i> Sao chép toàn bộ
                    </button>
                  </div>

                  {/* SMART MULTI-DOMAIN FILE/IMAGE UPLOAD & OCR BACKEND BOX */}
                  <div 
                    className={`smart-upload-container ${isDragOver ? 'drag-over' : ''}`}
                    onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={handleDrop}
                  >
                    <div className="upload-top-header">
                      <div className="upload-title">
                        <i className="fa-solid fa-camera-retro" style={{ color: 'var(--matcha-accent)' }}></i>
                        {currentPreset.actionHeader}
                      </div>
                      <span className="ocr-paste-badge">
                        <i className="fa-solid fa-paste"></i> Nhấn <strong>Ctrl + V</strong> để dán ảnh chụp màn hình
                      </span>
                    </div>

                    {/* Skill Sync Indicator Bar */}
                    <div className="skill-sync-banner">
                      <div className="sync-status">
                        <span className="sync-dot"></span>
                        <span>Đang xử lý theo kỹ năng:</span>
                        <strong>@{selectedSkill.id} ({selectedSkill.name})</strong>
                      </div>
                      <span className="sync-badge">
                        <i className="fa-solid fa-wand-magic-sparkles"></i> {currentPreset.standardDesc}
                      </span>
                    </div>

                    {/* Quick Demo Buttons */}
                    <div className="demo-buttons-bar">
                      <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)' }}>
                        <i className="fa-solid fa-file-lines"></i> Đề mẫu:
                      </span>
                      {currentPreset.samples.map((sample, idx) => (
                        <button 
                          key={idx} 
                          className="btn-demo-subject" 
                          onClick={() => loadPresetSample(sample)}
                        >
                          {sample.icon} {sample.title}
                        </button>
                      ))}
                    </div>

                    <input 
                      type="file" 
                      ref={fileInputRef} 
                      style={{ display: 'none' }}
                      accept="image/*,.pdf,.txt,.md,.docx"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          processFile(e.target.files[0]);
                        }
                      }}
                    />

                    <div 
                      className="upload-drop-area" 
                      style={{ marginTop: '12px' }}
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i>
                      <p style={{ fontWeight: 800, fontSize: '0.94rem', color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                        {currentPreset.dropText}
                      </p>
                      <p style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                        {currentPreset.dropSubText}
                      </p>
                      {isOcrLoading && (
                        <div style={{ marginTop: '10px', color: 'var(--matcha-primary)', fontWeight: 700, fontSize: '0.84rem' }}>
                          <i className="fa-solid fa-spinner fa-spin"></i> Đang nhận diện nội dung...
                        </div>
                      )}
                    </div>

                    {/* Multi-Domain Verification & Correction Card */}
                    {(imagePreview || extractedMathText) && (
                      <div className="math-verify-card">
                        <div className="math-verify-header">
                          <div className="math-verify-title">
                            <i className="fa-solid fa-circle-check"></i>
                            Nội dung nhận diện
                            <span className="badge-tag-aas badge-science" style={{ marginLeft: '8px', fontSize: '0.72rem' }}>
                              {detectedBadge}
                            </span>
                          </div>
                          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                            {imagePreview && (
