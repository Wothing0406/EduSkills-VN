<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSkills-VN Matcha Hub 🍵🐾 | Nhận Diện Đề Toán LaTeX & Dẫn Chứng SGK Chuẩn BGD 2026</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- React 18 & ReactDOM & Babel for zero-build execution -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Offline Static Skills & Books Bundle -->
  <script src="./skills-data.js"></script>

  <style>
    :root {
      --bg-cream: #F7F9F6;
      --bg-card: #FFFFFF;
      --bg-matcha-subtle: #EEF4EF;
      --bg-matcha-light: #DFECE2;
      
      --matcha-primary: #385E47;
      --matcha-dark: #22382B;
      --matcha-accent: #588B69;
      --matcha-leaf: #7DAA8B;
      
      --honey-warm: #E29578;
      --honey-light: #FFDDD2;
      --strawberry-milk: #F7CAD0;
      
      --text-main: #1D2D24;
      --text-muted: #5C7164;
      --text-light: #8E9F94;
      --border-color: #E2EAE4;
      --border-focus: #588B69;
      
      --shadow-soft: 0 8px 30px rgba(56, 94, 71, 0.06);
      --shadow-hover: 0 12px 36px rgba(56, 94, 71, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Top Navbar */
    .top-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-title-group h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .brand-title-group p {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--matcha-accent);
    }

    .version-tag {
      background: var(--honey-light);
      color: #9C4221;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }

    .nav-tabs-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-tab-btn {
      background: transparent;
      border: 1.5px solid transparent;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .nav-tab-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .nav-tab-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 12px rgba(56, 94, 71, 0.2);
    }

    .btn-guide-pill {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .btn-guide-pill:hover {
      background: #FFCAB9;
      transform: translateY(-2px);
    }

    /* Layout */
    .app-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      flex: 1;
    }

    .skills-workspace-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 992px) {
      .skills-workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Sidebar: Catalog */
    .catalog-sidebar {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 90px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .search-box-cute {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box-cute i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--matcha-leaf);
      font-size: 0.95rem;
    }

    .search-input-cute {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .search-input-cute:focus {
      border-color: var(--matcha-primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(88, 139, 105, 0.15);
    }

    /* Category Pills - Clean Wrapping, zero ugly scrollbar */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      background: var(--bg-cream);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 12px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .pill-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
    }

    /* Skills Scrollable List */
    .skills-scroll-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skills-scroll-list::-webkit-scrollbar {
      width: 5px;
    }
    .skills-scroll-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .skill-card-item {
      background: var(--bg-cream);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-card-item:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
      transform: translateX(3px);
    }

    .skill-card-item.active {
      background: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 16px rgba(56, 94, 71, 0.1);
    }

    .skill-card-info h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--matcha-dark);
      margin-bottom: 2px;
    }

    .skill-card-info p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--honey-warm);
      font-weight: 600;
    }

    .badge-mini {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .badge-science { background: #E8F5E9; color: #2E7D32; }
    .badge-social { background: #EDE7F6; color: #512DA8; }
    .badge-tech { background: #E1F5FE; color: #0288D1; }
    .badge-meta { background: #FFF3E0; color: #E65100; }

    /* Workstation */
    .aas-workstation {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-soft);
    }

    .workstation-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-back-catalog {
      background: none;
      border: none;
      color: var(--matcha-accent);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-back-catalog:hover {
      background: var(--bg-matcha-subtle);
    }

    .badge-tag-aas {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .workstation-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .workstation-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 20px;
    }

    /* Action Bar */
    .aas-action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1.5px solid var(--border-color);
      margin-bottom: 28px;
    }

    .btn-aas {
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary-aas {
      background: var(--matcha-primary);
      color: white;
      border: 1.5px solid var(--matcha-primary);
    }

    .btn-primary-aas:hover {
      background: var(--matcha-dark);
      border-color: var(--matcha-dark);
      transform: translateY(-2px);
    }

    .btn-outline-aas {
      background: white;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline-aas:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
    }

    .btn-honey-aas {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
    }

    .btn-honey-aas:hover {
      background: #FFCAB9;
    }

    /* SMART DROPZONE & MATH OCR SECTION */
    .smart-upload-container {
      background: #FAFBF9;
      border: 2px dashed var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 28px;
      transition: all 0.2s;
    }

    .smart-upload-container.drag-over {
      background: #E8F5E9;
      border-color: var(--matcha-primary);
    }

    .upload-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .upload-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-drop-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: white;
      border: 1.5px dashed var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .upload-drop-area:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-matcha-subtle);
    }

    .skill-sync-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-matcha-subtle);
      border: 1.5px solid #C8E6C9;
      border-radius: var(--radius-sm);
      padding: 9px 15px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--matcha-dark);
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #388E3C;
      box-shadow: 0 0 0 3px rgba(56, 142, 60, 0.2);
      animation: pulse-sync 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-sync {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 142, 60, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(56, 142, 60, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 142, 60, 0); }
    }

    .sync-badge {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--matcha-primary);
      background: white;
      border: 1px solid #C8E6C9;
      padding: 4px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .demo-buttons-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    .btn-demo-subject {
      background: white;
      border: 1px solid #C8E6C9;
      color: #2E7D32;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-demo-subject:hover {
      background: #E8F5E9;
      transform: translateY(-1px);
    }

    .ocr-paste-badge {
      background: #FFF3E0;
      border: 1px solid #FFE082;
      color: #E65100;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Image Preview & Extracted Math Verification Box */
    .math-verify-card {
      background: white;
      border: 1.5px solid #A5D6A7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 4px 16px rgba(46, 125, 50, 0.08);
    }

    .math-verify-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .math-verify-title {
      font-weight: 800;
      color: #1B5E20;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .image-preview-wrapper {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .image-preview-thumb {
      max-width: 140px;
      max-height: 100px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      object-fit: cover;
    }

    .btn-verify-math {
      background: #2E7D32;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-verify-math:hover {
      background: #1B5E20;
      transform: translateY(-2px);
    }

    .btn-clear-exercise {
      background: #FFEBEE;
      color: #C62828;
      border: 1.5px solid #FFCDD2;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-clear-exercise:hover {
      background: #FFCDD2;
      color: #B71C1C;
      transform: translateY(-1px);
    }

    /* Competency Tiers & Usage Context Styles */
    .tier-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tier-pill-card {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .tier-pill-card:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-matcha-subtle);
    }

    .tier-pill-card.active {
      border-color: var(--matcha-primary);
      background: #E8F5E9;
      box-shadow: 0 4px 12px rgba(56, 142, 60, 0.15);
    }

    .tier-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .tier-name {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .tier-badge-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--bg-matcha-light);
      color: var(--matcha-dark);
    }

    .tier-desc {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .context-selector-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-context-pill {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-context-pill:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-cream);
    }

    .btn-context-pill.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 2px 8px rgba(56, 94, 71, 0.2);
    }

    /* Prompt Export Modes Switcher */
    .prompt-mode-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 10px;
      width: fit-content;
      flex-wrap: wrap;
    }

    .btn-prompt-mode {
      background: transparent;
      border: none;
      color: #C8E6C9;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-prompt-mode.active {
      background: var(--matcha-primary);
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .btn-prompt-mode:hover:not(.active) {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* 5-Part Modern Prompt Builder Card */
    .prompt-builder-card {
      background: #FAFCF9;
      border: 2px solid var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(56, 94, 71, 0.05);
    }

    .builder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .builder-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;

    // Multi-Domain Educational Parser & Formatter (Offline Fallback & Client Utility)
    function formatMathProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '\\frac{$1}{$2}');
      text = text.replace(/([a-zA-Z0-9_]+)\/([a-zA-Z0-9_]+)/g, '\\frac{$1}{$2}');
      text = text.replace(/\^([0-9a-zA-Z\+\-]+)/g, '^{$1}');
      text = text.replace(/(?:sqrt|căn)\(([^)]+)\)/gi, '\\sqrt{$1}');
      text = text.replace(/(?:sqrt|căn)\s*([a-zA-Z0-9]+)/gi, '\\sqrt{$1}');
      text = text.replace(/lim\s*x\s*->\s*(\+?oo|\+?inf)/gi, '\\lim_{x \\to +\\infty}');
      text = text.replace(/lim\s*x\s*->\s*(-oo|-inf)/gi, '\\lim_{x \\to -\\infty}');
      text = text.replace(/vec\(([a-zA-Z]+)\)/gi, '\\vec{$1}');
      text = text.replace(/int_([0-9a-zA-Z]+)\^([0-9a-zA-Z]+)/g, '\\int_{$1}^{$2}');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatPhysicsProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\b(m\/s2|m\/s\^2)\b/g, '$\\text{m/s}^2$');
      text = text.replace(/\b(m\/s)\b/g, '$\\text{m/s}$');
      text = text.replace(/([0-9]+)\s*K\b/g, '$1\\text{ K}');
      text = text.replace(/([0-9]+)\s*oC\b/gi, '$1^\\circ\\text{C}');
      text = text.replace(/([0-9]+)\s*Pa\b/g, '$1\\text{ Pa}');
      text = text.replace(/([0-9]+)\s*atm\b/g, '$1\\text{ atm}');
      text = text.replace(/([0-9]+)\s*N\b/g, '$1\\text{ N}');
      text = text.replace(/([0-9]+)\s*J\b/g, '$1\\text{ J}');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatChemistryProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      const dict = [
        { vn: /axit\s+axetic/gi, iupac: 'ethanoic acid (acetic acid)' },
        { vn: /axit\s+sunfuric/gi, iupac: 'sulfuric acid (H2SO4)' },
        { vn: /axit\s+clohidric/gi, iupac: 'hydrochloric acid (HCl)' },
        { vn: /axit\s+nitric/gi, iupac: 'nitric acid (HNO3)' },
        { vn: /ancol\s+etylic/gi, iupac: 'ethanol (C2H5OH)' },
        { vn: /glucozo/gi, iupac: 'glucose (C6H12O6)' },
        { vn: /\bđồng\b/gi, iupac: 'copper (Cu)' },
        { vn: /\bsắt\b/gi, iupac: 'iron (Fe)' },
        { vn: /\bnhôm\b/gi, iupac: 'aluminium (Al)' },
        { vn: /\bnatri\b/gi, iupac: 'sodium (Na)' }
      ];
      dict.forEach(item => { text = text.replace(item.vn, item.iupac); });
      text = text.replace(/->|-->/g, ' $\\rightarrow$ ');
      text = text.replace(/Delta\s*r\s*H\s*0\s*298/gi, '$\\Delta_r H^0_{298}$');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

      }
      return text;
    }

        description: 'Mổ xẻ cạm bẫy tâm lý, sai thứ nguyên, quên điều kiện xác định và lỗi suy luận thường gặp.'
      },
      'soan-de': {
        id: 'soan-de',
        title: 'Soạn Ma Trận & Đề Tương Tự',
        icon: 'fa-solid fa-pen-ruler',
        tagline: 'Khảo Thí & Đề Kiểm Tra Tương Đương',
        description: 'Thiết kế 1 đề kiểm tra tương đương cùng cấp độ nhận thức kèm ma trận và hướng dẫn chấm chi tiết.'
      },
      'on-cap-toc': {
        id: 'on-cap-toc',
        title: 'Ôn Cấp Tốc 60s & Mindmap',
        icon: 'fa-solid fa-bolt-lightning',
        tagline: 'Mermaid Mindmap & 5 Khóa Cốt Lõi',
        description: 'Tóm lược siêu tốc toàn bộ kiến thức trọng tâm bằng sơ đồ tư duy Mermaid Cornell và bảng công thức 60 giây.'
      }
    };

    function App() {
      const [skills, setSkills] = useState(DEFAULT_CATALOG);
      const [selectedSkillId, setSelectedSkillId] = useState('toan-thpt');
      const [activeTab, setActiveTab] = useState('skills'); // skills | drive | prompt-standard | guide
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [shortlist, setShortlist] = useState({});
      const [toastMsg, setToastMsg] = useState('');
      const [showToast, setShowToast] = useState(false);
      const [showGuideModal, setShowGuideModal] = useState(false);

      // --- OCR State (Đồng bộ tuyệt đối theo selectedSkillId, KHÔNG gây mâu thuẫn) ---
      const [detectedBadge, setDetectedBadge] = useState('📐 Toán học • LaTeX Chuẩn Quốc Tế');
      const [isOcrLoading, setIsOcrLoading] = useState(false);
      const [ocrInfo, setOcrInfo] = useState(null); // { isRealOcr, confidence, scanDurationMs, engine }

      // --- 5-Part Modern Prompt Builder State (docs/Tieuchuanprompt.md) ---
      const [rolePrompt, setRolePrompt] = useState('Chuyên gia Sư phạm Toán THPT chuẩn GDPT 2018 & Đề thi BGD 2026');
      const [gradeLevel, setGradeLevel] = useState(12);
      const [studentLevel, setStudentLevel] = useState('Điểm 7.0 - 8.5 (Chuẩn BGD)');
      const [currentStatus, setCurrentStatus] = useState('Đã nắm được phần lý thuyết cơ bản nhưng chưa vững phần bẫy trắc nghiệm');
      const [taskPrompt, setTaskPrompt] = useState('Phân tích bản chất, giải bài từng bước và chỉ ra 3 bẫy sai lầm kinh điển');
      const [constraintsPrompt, setConstraintsPrompt] = useState('Trình bày bằng LaTeX chuẩn ($...$), chia bảng so sánh, kiểm tra nghiệm');
      
      // Competency Tiers, Usage Contexts & Universal Agent Export Modes
      const [competencyTier, setCompetencyTier] = useState('vd'); // 'nb-th' | 'vd' | 'vdc' | 'hsg'
      const [usageContext, setUsageContext] = useState('giai-de'); // 'giai-de' | 'socrates' | 'chua-bay' | 'soan-de' | 'on-cap-toc'
      const [promptExportMode, setPromptExportMode] = useState('standard'); // 'standard' | 'system-prompt' | 'agent-cli'

      // Cognitive Toggles
      const [useCoT, setUseCoT] = useState(true);
      const [useSocratic, setUseSocratic] = useState(true);
      const [useFewShot, setUseFewShot] = useState(false);
      const [useActiveRecall, setUseActiveRecall] = useState(true);
      
      // Specific Book Selection
      const [selectedBookFile, setSelectedBookFile] = useState('');

      // Document / Exercise Attachment & Upload
      const [docAttachment, setDocAttachment] = useState('');
      const [uploadedFile, setUploadedFile] = useState(null);
      const [imagePreview, setImagePreview] = useState('');
      const [extractedMathText, setExtractedMathText] = useState('');
      const [isDragOver, setIsDragOver] = useState(false);
      const fileInputRef = useRef(null);

      // Helper to completely clear/detach attached exercise from prompt
      const clearExerciseFromPrompt = () => {
        setDocAttachment('');
        setExtractedMathText('');
        setImagePreview('');
        setUploadedFile(null);
        setOcrInfo(null);
        triggerToast('Đã xóa & gỡ bỏ hoàn toàn bài tập khỏi Prompt! 🧹✨');
      };

      // Helper to quickly load math demo
      const loadDemoMath = () => {
        setSelectedSkillId('toan-thpt');
        setGradeLevel(12);
        const sample = SKILL_PRESET_CONFIGS['toan-thpt'].samples[0];
        setExtractedMathText(sample.content);
        setDocAttachment(sample.content);
        setDetectedBadge(SKILL_PRESET_CONFIGS['toan-thpt'].domainBadge);
        triggerToast('Đã nạp đề toán mẫu chuẩn GDPT 2018! 📐✨');
      };

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2600);
      };

      // Load Catalog from API (with fallback)
      useEffect(() => {
        fetch('/api/skills')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setSkills(data);
            }
          })
          .catch(() => {
            if (window.EDUSKILLS_CATALOG) setSkills(window.EDUSKILLS_CATALOG);
          });

        try {
          const saved = localStorage.getItem('eduskills_shortlist');
          if (saved) setShortlist(JSON.parse(saved));
        } catch (e) {}
      }, []);

      const selectedSkill = useMemo(() => {
        return skills.find(s => s.id === selectedSkillId) || skills[0] || {};
      }, [skills, selectedSkillId]);

      // Cấu hình preset chuyên biệt tương ứng kỹ năng đang chọn
      const currentPreset = useMemo(() => {
        return SKILL_PRESET_CONFIGS[selectedSkillId] || SKILL_PRESET_CONFIGS['toan-thpt'];
      }, [selectedSkillId]);

      // Get available specific books for current skill and grade
      const availableBooks = useMemo(() => {
        const skillBooks = BOOKS_DATABASE[selectedSkill.id] || BOOKS_DATABASE['toan-thpt'] || {};
        return skillBooks[gradeLevel] || [];
      }, [selectedSkill, gradeLevel]);

      // Set default book file when grade or skill changes
      useEffect(() => {
        if (availableBooks.length > 0) {
          setSelectedBookFile(availableBooks[0].file);
        } else {
          setSelectedBookFile('');
        }
      }, [availableBooks]);

      const currentBookObject = useMemo(() => {
        return availableBooks.find(b => b.file === selectedBookFile) || availableBooks[0] || null;
      }, [availableBooks, selectedBookFile]);

      // TỰ ĐỘNG ĐỒNG BỘ HOÀN TOÀN KHI CHUYỂN SKILL Ở THANH BÊN (XÓA BỎ HOÀN TOÀN MÂU THUẪN)
      useEffect(() => {
        if (!selectedSkill.id) return;
        const config = SKILL_PRESET_CONFIGS[selectedSkill.id] || SKILL_PRESET_CONFIGS['toan-thpt'];
        setDetectedBadge(config.domainBadge);

        // Nếu người dùng chưa tải ảnh riêng lên, tự động cập nhật đề mẫu và ngữ liệu theo môn đang chọn
        if (!imagePreview) {
          const initialSample = config.samples && config.samples[0] ? config.samples[0].content : '';
          setExtractedMathText(initialSample);
          setDocAttachment(initialSample);
          setOcrInfo(null);
        } else {
          // Nếu đã có ảnh tải lên, bóc tách lại văn bản theo đúng chuẩn của môn vừa chọn
          const res = formatProblemBySubject(extractedMathText, selectedSkill.id);
          setExtractedMathText(res.formatted);
        }

        // Cập nhật vai trò sư phạm tương ứng môn học
        const subjectMap = {
          'toan-thpt': 'Chuyên gia Sư phạm Toán THPT chuẩn GDPT 2018 & Đề thi BGD 2026',
          'vat-li-thpt': 'Gia sư Vật lí THPT chuyên sâu Vật lí nhiệt, Khí lí tưởng & Đơn vị SI',
          'hoa-hoc-thpt': 'Chuyên gia Hóa học IUPAC 100% tiếng Anh chuẩn SGK mới',
          'sinh-hoc-thpt': 'Cố vấn Sinh học THPT chuyên sâu Di truyền phân tử & Phả hệ',
          'ngu-van-thpt': 'Giáo viên Ngữ văn THPT chuyên luyện Đọc hiểu ngoài SGK & NLXH 200 chữ',
          'tieng-anh-thpt': 'Giáo viên Tiếng Anh THPT chuyên luyện Đọc hiểu B2-C1 & Ngữ pháp',
          'lich-su-thpt': 'Cố vấn Lịch sử THPT chuyên sâu Mốc sự kiện, Kháng chiến & Lập luận',
          'dia-li-thpt': 'Chuyên gia Địa lí THPT chuyên phân tích Biểu đồ, Số liệu & Atlat',
          'ktpl-thpt': 'Cố vấn Giáo dục Kinh tế & Pháp luật chuyên xử lý tình huống thực tế',
          'tin-hoc-thpt': 'Kỹ sư Sư phạm Tin học THPT chuyên thuật toán Python & Cấu trúc dữ liệu',
          'cong-nghe-thpt': 'Kỹ sư Công nghệ THPT chuyên mạch điện tử & Nông nghiệp 4.0',
          'giai-chi-tiet': 'Gia sư Sư phạm Đa Tầng Socrates (Khơi mở tư duy, không lộ đáp số ngay)',
          'tao-quiz-bgd': 'Chuyên gia khảo thí thiết kế đề thi 3 phần chuẩn QĐ 764/QĐ-BGDĐT',
          'slide-thuyet-trinh': 'Presentation Architect chuyên thiết kế slide Marp 16:9 chuẩn sư phạm',
          'tomtat-mindmap': 'Chuyên gia Siêu Trí Nhớ & Sơ đồ tư duy Mermaid Cornell 60 giây',
          'luan-an-nghiencuu': 'Cố vấn Nghiên cứu Khoa học Kỹ thuật THPT (Hội thi ViSEF)'
        };
        setRolePrompt(subjectMap[selectedSkill.id] || `Chuyên gia giảng dạy môn ${selectedSkill.name} THPT`);
      }, [selectedSkillId]);

      // Filtered Skills
      const filteredSkills = useMemo(() => {
        return skills.filter(item => {
          const matchCat = selectedCategory === 'all' || item.category === selectedCategory;
          const matchQuery = (item.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                             (item.description || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                             (item.id && item.id.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchCat && matchQuery;
        });
      }, [skills, selectedCategory, searchQuery]);

      // --- GLOBAL CLIPBOARD PASTE LISTENER (Ctrl + V Screenshots) ---
      useEffect(() => {
        const handlePaste = (e) => {
          if (!e.clipboardData || !e.clipboardData.items) return;
          for (let i = 0; i < e.clipboardData.items.length; i++) {
            const item = e.clipboardData.items[i];
            if (item.type.indexOf('image') !== -1) {
              const file = item.getAsFile();
              if (file) {
                processFile(file, 'Ảnh chụp màn hình (Clipboard Ctrl+V)');
                triggerToast('Đã dán ảnh bài tập từ Clipboard (Ctrl + V)! 📸🐾');
                e.preventDefault();
                break;
              }
            }
          }
        };
        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [selectedSkillId, gradeLevel]);

      // --- UNIVERSAL AI AGENT PROMPT GENERATOR (3 MODES: WEB CHAT, SYSTEM PROMPT, AGENT CLI) ---
      const generatedPromptPayload = useMemo(() => {
        const driveInfo = DRIVE_LINKS_MAP[gradeLevel] || DRIVE_LINKS_MAP[12];
        const bookTitle = currentBookObject ? currentBookObject.title : `Sách Giáo Khoa Lớp ${gradeLevel}`;
        const bookFile = currentBookObject ? currentBookObject.file : 'Tài liệu SGK chuẩn';
        const bookDrive = currentBookObject ? currentBookObject.drive : driveInfo.url;
        
        const tierObj = COMPETENCY_TIERS[competencyTier] || COMPETENCY_TIERS['vd'];
        const contextObj = USAGE_CONTEXTS[usageContext] || USAGE_CONTEXTS['giai-de'];

        // MODE 2: SYSTEM PROMPT CHO AI AGENT (XML / STRUCTURED FORMAT CHO CLAUDE / GEMINI / GPT-4O)
        if (promptExportMode === 'system-prompt') {
          let xml = `<system_instruction version="0.1.3-beta" framework="EduSkills-VN" standard="GDPT-2018">\n`;
          xml += `  <identity>\n`;
          xml += `    <role>${rolePrompt}</role>\n`;
          xml += `    <subject_skill>@${selectedSkillId} (${selectedSkill.name || ''})</subject_skill>\n`;
          xml += `    <grade_level>Lớp ${gradeLevel}</grade_level>\n`;
          xml += `    <author_attribution>Dự án EduSkills-VN | Chủ nhiệm: Nguyễn Duy Quang (0795277227)</author_attribution>\n`;
          xml += `  </identity>\n\n`;

          xml += `  <pedagogical_competency_tier level="${tierObj.id}">\n`;
          xml += `    <tier_name>${tierObj.name}</tier_name>\n`;
          xml += `    <target_score>${tierObj.scoreTarget}</target_score>\n`;
          xml += `    <pedagogical_mandate>${tierObj.description}</pedagogical_mandate>\n`;
          xml += `  </pedagogical_competency_tier>\n\n`;

          xml += `  <operational_context scenario="${contextObj.id}">\n`;
          xml += `    <scenario_title>${contextObj.title}</scenario_title>\n`;
          xml += `    <methodology_tagline>${contextObj.tagline}</methodology_tagline>\n`;
          xml += `    <instruction_mandate>${contextObj.description}</instruction_mandate>\n`;
          xml += `    <scaffolding_rule>Tuân thủ cấu trúc phân tích 4 tầng Socrates và barem Quyết định 764/QĐ-BGDĐT.</scaffolding_rule>\n`;
          xml += `  </operational_context>\n\n`;

          xml += `  <grounding_knowledge_base>\n`;
          xml += `    <mandate>TUYỆT ĐỐI CẤM BỊA ĐẶT CÔNG THỨC NGOÀI CHƯƠNG TRÌNH HOẶC DÙNG MẸO PHẢN SƯ PHẠM</mandate>\n`;
          xml += `    <target_textbook>${bookTitle}</target_textbook>\n`;
          xml += `    <pdf_reference_code>${bookFile}</pdf_reference_code>\n`;
          xml += `    <cloud_drive_repository>${bookDrive}</cloud_drive_repository>\n`;
          xml += `    <citation_rule>Mọi công thức, định lý, tên bài học phải được đối chiếu trực tiếp từ cuốn SGK trên.</citation_rule>\n`;
          xml += `  </grounding_knowledge_base>\n\n`;

          xml += `  <execution_constraints>\n`;
          xml += `    <constraints>${constraintsPrompt}</constraints>\n`;
          xml += `    <latex_rule>Mọi biểu thức toán/lý phải bọc trong LaTeX chuẩn: $...$ hoặc $$...$$</latex_rule>\n`;
          xml += `    <chemistry_rule>Nếu là môn Hóa: bắt buộc danh pháp IUPAC 100% tiếng Anh</chemistry_rule>\n`;
          xml += `    <methodology>Chain-of-Thought từng bước, gợi mở Socratic khơi dậy phản biện, chống ảo giác 100%</methodology>\n`;
          xml += `  </execution_constraints>\n\n`;

          xml += `  <task_instruction>\n`;
          xml += `    <task>${taskPrompt}</task>\n`;
          if (docAttachment.trim()) {
            xml += `    <verified_problem_input>\n${docAttachment.trim()}\n    </verified_problem_input>\n`;
          } else {
            xml += `    <mode>Pure System Directive: Hãy tự động khởi tạo 01 đề bài mẫu chuẩn ở cấp độ "${tierObj.name}" theo SGK "${bookTitle}" và triển khai giảng dạy theo ngữ cảnh "${contextObj.title}".</mode>\n`;
          }
          xml += `  </task_instruction>\n`;
          xml += `</system_instruction>`;
          return xml;
        }

        // MODE 3: LỆNH NẠP CLI / TERMINAL CHO AI AGENT (ANTIGRAVITY SDK / CLAUDE CODE / NPX)
        if (promptExportMode === 'agent-cli') {
          let cli = `# ==============================================================================\n`;
          cli += `# 💻 BỘ NẠP KỸ NĂNG CHO AI AGENT (CLI / TERMINAL / ANTIGRAVITY SDK / CLAUDE CODE)\n`;
          cli += `# Phiên bản: v0.1.3-beta • Dự án EduSkills-VN (Chủ nhiệm: Nguyễn Duy Quang)\n`;
          cli += `# ==============================================================================\n\n`;

          cli += `# 1. Nạp kỹ năng vào Google Antigravity SDK & Gemini CLI:\n`;
          cli += `gemini run --system-skill "skills/${selectedSkill.category || 'khoa-hoc-tu-nhien'}/${selectedSkillId}/SKILL.md" \\\n`;
          cli += `  --grade ${gradeLevel} \\\n`;
          cli += `  --tier "${tierObj.id}" \\\n`;
          cli += `  --context "${contextObj.id}" \\\n`;
          cli += `  --book "${bookFile}"`;
          if (docAttachment.trim()) {
            const cleanSnippet = docAttachment.trim().replace(/\r?\n/g, ' ').slice(0, 100);
            cli += ` \\\n  --input "${cleanSnippet}..."\n\n`;
          } else {
            cli += `\n\n`;
          }

          cli += `# 2. Nạp kỹ năng vào Claude Code CLI:\n`;
          cli += `/skill load skills/${selectedSkill.category || 'khoa-hoc-tu-nhien'}/${selectedSkillId}/SKILL.md\n\n`;

          cli += `# 3. Nạp kỹ năng qua EduSkills-VN Package Manager (Node.js / NPX):\n`;
          cli += `npx eduskills-vn load ${selectedSkillId} --grade ${gradeLevel} --tier ${tierObj.id} --context ${contextObj.id}\n\n`;

          cli += `# 4. Gọi API Backend EduSkills-VN trực tiếp từ Terminal (Port 3000):\n`;
          cli += `curl -X POST http://localhost:3000/api/generate-prompt \\\n`;
          cli += `  -H "Content-Type: application/json" \\\n`;
          cli += `  -d '{\n`;
          cli += `    "subject": "${selectedSkillId}",\n`;
          cli += `    "gradeLevel": ${gradeLevel},\n`;
          cli += `    "competencyTier": "${tierObj.id}",\n`;
          cli += `    "usageContext": "${contextObj.id}",\n`;
          cli += `    "exportMode": "system-prompt",\n`;
          cli += `    "verifiedContent": ${JSON.stringify(docAttachment.trim())}\n`;
          cli += `  }'\n`;
          return cli;
        }

        // MODE 1 (MẶC ĐỊNH): 5 KHUNG CHUẨN TIEUCHUANPROMPT.MD CHO CHAT WEB
        let p = `# ==============================================================================\n`;
        p += `# 🍵 EDUSKILLS-VN INTENT-DRIVEN PROMPT (CHUẨN TIEUCHUANPROMPT.MD & BGD 2026)\n`;
        p += `# Phiên bản: v0.1.3-beta • Khối Lớp: ${gradeLevel} • Môn: ${selectedSkillId}\n`;
        p += `# ==============================================================================\n\n`;

        p += `## 🎯 1. MỤC TIÊU & NHIỆM VỤ THỰC THI (WHAT THIS PROMPT DOES)\n`;
        p += `- **Vai trò sư phạm:** ${rolePrompt}.\n`;
        p += `- **Nhiệm vụ cụ thể:** ${taskPrompt}.\n`;
        p += `- **Ngữ cảnh sử dụng sư phạm:** ${contextObj.title} (${contextObj.tagline}).\n`;
        p += `  * *Định hướng sư phạm:* ${contextObj.description}\n`;
        p += `- **Hành động sư phạm bắt buộc:**\n`;
        if (useCoT) p += `  * [Chain-of-Thought]: Giải thích bản chất từng bước (step-by-step) trước khi kết luận.\n`;
        if (useSocratic) p += `  * [Socratic Method]: Đặt câu hỏi gợi mở để người học tự động não, không đưa ngay đáp số thô.\n`;
        if (useFewShot) p += `  * [Few-shot]: Minh họa bằng 1 ví dụ tương đương theo phong cách chuẩn mực.\n`;
        if (useActiveRecall) p += `  * [Active Recall]: Ở cuối bài giải, BẮT BUỘC đặt 1 câu hỏi kiểm tra tư duy phản biện hoặc bài tập tương tự.\n`;

        p += `\n## 🧠 2. CƠ SỞ NHẬN THỨC & BỐI CẢNH (WHAT THE AI MUST UNDERSTAND)\n`;
        p += `- **Đối tượng người học:** Học sinh Lớp ${gradeLevel}, theo học Chương trình GDPT 2018.\n`;
        p += `- **Phân cấp bậc năng lực nhận thức:** ${tierObj.name} [${tierObj.badge}].\n`;
        p += `  * *Mục tiêu đánh giá:* ${tierObj.scoreTarget}\n`;
        p += `  * *Yêu cầu năng lực:* ${tierObj.description}\n`;
        p += `- **Trình độ người học thiết lập:** "${studentLevel}".\n`;
        p += `- **Tình trạng nhận thức hiện thời:** ${currentStatus}.\n`;
        p += `- **Bẫy phòng thi cần cảnh báo:** Quên điều kiện xác định, nhầm đơn vị chuẩn SI, sai danh pháp IUPAC hoặc lỗi suy luận trắc nghiệm.\n`;

        p += `\n## 📖 3. DẪN CHỨNG & CHỈ DẪN CÓ CHỦ ĐÍCH (INTENTIONAL GROUNDING & CITATIONS)\n`;
        p += `- **Sách Giáo Khoa chỉ định:** ${bookTitle}\n`;
        p += `- **Mã File PDF Gốc tham chiếu:** \`${bookFile}\`\n`;
        p += `- **Thư mục Google Drive trực tiếp:** ${bookDrive}\n`;
        p += `- **CHỈ DẪN BẮT BUỘC ĐỐI SOÁT:**\n`;
        p += `  1. Mọi công thức, định lý, định luật và phương pháp giải ĐỀU PHẢI TRÍCH DẪN VÀ ĐỐI CHIẾU TRỰC TIẾP từ cuốn sách giáo khoa trên.\n`;
        p += `  2. TUYỆT ĐỐI CẤM sử dụng các công thức ngoài chương trình hoặc các thuật toán mẹo làm mất đi bản chất khoa học.\n`;
        p += `  3. Hãy chỉ rõ tên chương/bài học cụ thể trong SGK để học sinh có thể mở sách tra cứu lại ngay lập tức.\n`;

        p += `\n## ⚡ 4. RÀNG BUỘC KỸ THUẬT & ĐỊNH DẠNG ĐẦU RA (OUTPUT CONSTRAINTS & FORMAT)\n`;
        p += `- ${constraintsPrompt}.\n`;
        p += `- Tuân thủ nghiêm ngặt Barem điểm lũy tiến và định dạng đề thi 3 phần của Bộ GD&ĐT (Quyết định 764/QĐ-BGDĐT).\n`;
        p += `- Cấu trúc trả lời 4 tầng Socrates:\n`;
        p += `  * **Tầng 1:** Gợi Mở Tư Duy Socrates (Socratic Clue - Không lộ đáp số).\n`;
        p += `  * **Tầng 2:** Bản Chất Lý Thuyết & Chiến Thuật Tiếp Cận Tối Ưu.\n`;
        p += `  * **Tầng 3:** Lời Giải Chi Tiết Từng Bước (Full Step-by-Step, có lập luận cho từng phép biến đổi).\n`;
        p += `  * **Tầng 4:** Giải Mã Bẫy Phòng Thi & 1 Bài Tập Tự Luyện Tương Tự.\n`;

        if (docAttachment.trim()) {
          p += `\n## 📝 5. NỘI DUNG ĐỀ BÀI / NGỮ LIỆU ĐÃ XÁC NHẬN KIỂM CHỨNG\n`;
          p += `\`\`\`text\n${docAttachment.trim()}\n\`\`\`\n\n`;
          p += `👉 Bắt đầu phân tích và giải quyết bài toán theo đầy đủ 4 tầng sư phạm trên:`;
        } else {
          p += `\n## 📝 5. CHẾ ĐỘ PROMPT SƯ PHẠM THUẦN (CHƯA ĐÍNH KÈM BÀI TẬP CỤ THỂ)\n`;
          p += `- **Tình trạng đính kèm:** Không có bài tập cụ thể trong prompt này (người dùng đã gỡ bài tập hoặc muốn dùng Prompt Hệ Thống).\n`;
          p += `- **YÊU CẦU ĐỐI VỚI AI:**\n`;
          p += `  1. Tự động khởi tạo 01 bài toán / câu hỏi mẫu điển hình trong chương trình SGK "${bookTitle}" ở Cấp độ nhận thức: "${tierObj.name}" (${tierObj.scoreTarget}).\n`;
          p += `  2. Đóng vai trò "${rolePrompt}" và triển khai giảng dạy bài toán mẫu đó theo đúng ngữ cảnh "${contextObj.title}" (${contextObj.tagline}).\n`;
          p += `  3. Hướng dẫn từng bước và đặt câu hỏi phản xạ để người học cùng tương tác.\n`;
        }

        return p;
      }, [rolePrompt, gradeLevel, studentLevel, currentStatus, taskPrompt, constraintsPrompt, useCoT, useSocratic, useFewShot, useActiveRecall, currentBookObject, docAttachment, competencyTier, usageContext, promptExportMode, selectedSkillId, selectedSkill]);

      // --- Handle File & Image Upload with OCR Backend ---
      const processFile = (file, customName) => {
        if (!file) return;
        setUploadedFile(file);
        setIsOcrLoading(true);

        const fileName = customName || file.name || 'de-bai-tap.png';

        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const dataUrl = e.target.result;
            setImagePreview(dataUrl);

            // Gửi lên Backend /api/ocr
            try {
              const res = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  image: dataUrl,
                  subject: selectedSkillId,
                  grade: gradeLevel,
                  fileName: fileName,
                  fileType: file.type
                })
              });
              const data = await res.json();
              if (data.success && data.formattedText) {
                setExtractedMathText(data.formattedText);
                setDetectedBadge(data.domainBadge || currentPreset.domainBadge);
                setOcrInfo({
                  isRealOcr: data.isRealOcr,
                  confidence: data.ocrConfidence,
                  scanDurationMs: data.scanDurationMs,
                  engine: data.ocrEngine
                });
                triggerToast(`⚡ Đã quét chữ thành công (${data.ocrConfidence}% tin cậy, ${data.scanDurationMs || 0}ms)! 🐾`);
              } else {
                throw new Error('Fallback offline parser');
              }
            } catch (err) {
              // Fallback client-side parser
              const clientResult = formatProblemBySubject(
                `Cho bài tập nhận diện từ ảnh "${fileName}".\n1. Xác định điều kiện và viết công thức toán/hóa/lý.\n2. Giải chi tiết từng bước.`,
                selectedSkillId
              );
              setExtractedMathText(clientResult.formatted);
              setDetectedBadge(clientResult.badge || currentPreset.domainBadge);
              setOcrInfo({
                isRealOcr: false,
                confidence: 80,
                scanDurationMs: 0,
                engine: 'Heuristic Offline Parser'
              });
              triggerToast(`Đã nhận diện ảnh đề bài "${fileName}" (Offline mode)! 📷🐾`);
            } finally {
              setIsOcrLoading(false);
            }
          };
          reader.readAsDataURL(file);
        } else {
          // Document / Text / PDF
          setImagePreview('');
          const reader = new FileReader();
          reader.onload = async (e) => {
            const rawContent = e.target.result;
            try {
              const res = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: rawContent,
                  subject: selectedSkillId,
                  grade: gradeLevel,
                  fileName: fileName,
                  fileType: file.type
                })
              });
              const data = await res.json();
              if (data.success && data.formattedText) {
                setExtractedMathText(data.formattedText);
                setDetectedBadge(data.domainBadge || currentPreset.domainBadge);
                setOcrInfo({
                  isRealOcr: false,
                  confidence: 100,
                  scanDurationMs: 0,
                  engine: 'PDF & Document Parser'
                });
                triggerToast(`⚡ Đã phân tích tài liệu "${fileName}" qua OCR Backend! 📄`);
              } else {
                throw new Error('Fallback offline parser');
              }
            } catch (err) {
              const clientResult = formatProblemBySubject(rawContent, selectedSkillId);
              setExtractedMathText(clientResult.formatted);
              setDetectedBadge(clientResult.badge || currentPreset.domainBadge);
              triggerToast(`Đã đọc nội dung tài liệu "${fileName}"! 📄`);
            } finally {
              setIsOcrLoading(false);
            }
          };
          reader.readAsText(file);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      // Transfer verified exercise into Prompt
      const applyVerifiedMathToPrompt = () => {
        if (!extractedMathText.trim()) return;
        setDocAttachment(extractedMathText.trim());
        triggerToast('Đã xác nhận & nạp đề bài vào Prompt Sư Phạm! ✅');
      };

      // Nạp đề mẫu theo đúng kỹ năng đang chọn (Không gây mâu thuẫn)
      const loadPresetSample = (sample) => {
        setExtractedMathText(sample.content);
        setDocAttachment(sample.content);
        setDetectedBadge(currentPreset.domainBadge);
        triggerToast(`Đã nạp đề mẫu: ${sample.title}! ✨🐾`);
      };

      // --- Offline Downloads & Copies ---
      const handleDownloadSkillMd = () => {
        try {
          const content = selectedSkill.rawContent || `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${selectedSkill.id || 'skill'}.SKILL.md`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          triggerToast(`Đã tải file ${selectedSkill.id}.SKILL.md về máy! 💾🐾`);
        } catch (e) {
          triggerToast(`Lỗi: ${e.message}`);
        }
      };

      const handleCopyPromptPayload = async () => {
        try {
          await navigator.clipboard.writeText(generatedPromptPayload);
          triggerToast(`Đã sao chép Prompt chuẩn Tieuchuanprompt.md! 📋✨`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      const handleCopyFullContent = async () => {
        try {
          let text = selectedSkill.rawContent || '';
          if (!text) {
            text = `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          } else {
            text += `\n\n========================================\n[PROMPT SƯ PHẠM ĐÍNH KÈM TỪ EDUSKILLS-VN]:\n${generatedPromptPayload}\n========================================\n`;
          }
          await navigator.clipboard.writeText(text);
          triggerToast(`Đã sao chép toàn bộ Master Playbook ${selectedSkill.id}.SKILL.md! 🍵`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      return (
        <div>
          {/* Top Navbar */}
          <header className="top-navbar">
            <div className="brand-section" onClick={() => setActiveTab('skills')}>
              <svg className="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="#588B69" />
                <path d="M28 35L36 18L44 32" fill="#E29578" />
                <path d="M72 35L64 18L56 32" fill="#E29578" />
                <circle cx="50" cy="52" r="32" fill="#FFFFFF" />
                <ellipse cx="40" cy="48" rx="4" ry="5" fill="#22382B" />
                <ellipse cx="60" cy="48" rx="4" ry="5" fill="#22382B" />
                <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF" />
                <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF" />
                <path d="M48 54L52 54L50 57Z" fill="#E29578" />
                <path d="M46 59C48 61 52 61 54 59" stroke="#22382B" strokeWidth="2" strokeLinecap="round" />
                <ellipse cx="33" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <ellipse cx="67" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <path d="M38 72H62C62 72 60 84 50 84C40 84 38 72 38 72Z" fill="#385E47" />
                <ellipse cx="50" cy="72" rx="12" ry="3" fill="#7DAA8B" />
              </svg>
              <div className="brand-title-group">
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <h1>EduSkills-VN</h1>
                  <span className="version-tag">v0.1.3-beta</span>
                </div>
                <p>🍵 Matcha Mèo Ú • Nhận Diện Đề Toán & Dẫn Chứng SGK Chuẩn</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="nav-tabs-group">
              <button 
                className={`nav-tab-btn ${activeTab === 'skills' ? 'active' : ''}`}
                onClick={() => setActiveTab('skills')}
              >
                <i className="fa-solid fa-graduation-cap"></i> 16 Kỹ Năng THPT
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'drive' ? 'active' : ''}`}
                onClick={() => setActiveTab('drive')}
              >
                <i className="fa-brands fa-google-drive"></i> Tủ Sách SGK Cloud
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'prompt-standard' ? 'active' : ''}`}
                onClick={() => setActiveTab('prompt-standard')}
              >
                <i className="fa-solid fa-scroll"></i> Tiêu Chuẩn Prompt Mạnh
              </button>
              <button 
                className="btn-guide-pill"
                onClick={() => setShowGuideModal(true)}
              >
                <i className="fa-solid fa-circle-question"></i> Hướng Dẫn Sử Dụng
              </button>
            </div>
          </header>

          {/* Main App Container */}
          <main className="app-container">
            {/* VIEW 1: SKILLS & WORKSTATION */}
            {activeTab === 'skills' && (
              <div className="skills-workspace-grid">
                {/* Left: Sidebar Catalog */}
                <aside className="catalog-sidebar">
                  <div className="search-box-cute">
                    <i className="fa-solid fa-magnifying-glass"></i>
                    <input 
                      type="text" 
                      className="search-input-cute" 
                      placeholder="Tìm môn học (/toan, /hoa, /quiz)..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>

                  {/* Category Pills - Clean Wrapping */}
                  <div className="category-pills">
                    {[
                      { id: 'all', label: 'Tất cả (16)' },
                      { id: 'khoa-hoc-tu-nhien', label: 'Tự nhiên' },
                      { id: 'khoa-hoc-xa-hoi', label: 'Xã hội' },
                      { id: 'ngon-ngu-cong-nghe', label: 'Công nghệ' },
                      { id: 'meta-tools', label: 'Meta-tools' }
                    ].map(cat => (
                      <button 
                        key={cat.id} 
                        className={`pill-btn ${selectedCategory === cat.id ? 'active' : ''}`}
                        onClick={() => setSelectedCategory(cat.id)}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>

                  {/* Skills Scrollable List */}
                  <div className="skills-scroll-list">
                    {filteredSkills.map(skill => {
                      const isSelected = skill.id === selectedSkill.id;
                      const isFav = !!shortlist[skill.id];
                      return (
                        <div 
                          key={skill.id} 
                          className={`skill-card-item ${isSelected ? 'active' : ''}`}
                          onClick={() => setSelectedSkillId(skill.id)}
                        >
                          <div className="skill-card-info">
                            <h4>{skill.name}</h4>
                            <p>@{skill.id} {isFav ? '💖' : ''}</p>
                          </div>
                          <span className={`badge-mini ${
                            skill.category === 'khoa-hoc-tu-nhien' ? 'badge-science' :
                            skill.category === 'khoa-hoc-xa-hoi' ? 'badge-social' :
                            skill.category === 'ngon-ngu-cong-nghe' ? 'badge-tech' : 'badge-meta'
                          }`}>
                            {skill.category ? skill.category.split('-')[0].toUpperCase() : 'SKILL'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </aside>

                {/* Right: AAS Core Workstation */}
                <section className="aas-workstation">
                  <div className="workstation-breadcrumb">
                    <button className="btn-back-catalog" onClick={() => setSelectedCategory('all')}>
                      <i className="fa-solid fa-arrow-left"></i> Danh mục kỹ năng
                    </button>
                    <span className="badge-tag-aas badge-science">
                      {selectedSkill.category || 'AAS CORE'}
                    </span>
                    <span className="badge-tag-aas badge-meta">
                      v0.1.2-beta
                    </span>
                    <span className="badge-tag-aas badge-tech">
                      GDPT 2018 • BGD 2026
                    </span>
                  </div>

                  <div className="workstation-header">
                    <div className="workstation-title">
                      @{selectedSkill.id}
                      {shortlist[selectedSkill.id] && <span style={{ fontSize: '1.4rem' }}>💖</span>}
                    </div>
                    <p className="workstation-desc">{selectedSkill.description}</p>
                  </div>

                  {/* Action Bar */}
                  <div className="aas-action-bar">
                    <button className="btn-aas btn-primary-aas" onClick={handleDownloadSkillMd}>
                      <i className="fa-solid fa-download"></i> Lưu về máy (.md)
                    </button>
                    <button 
                      className={`btn-aas ${shortlist[selectedSkill.id] ? 'btn-honey-aas' : 'btn-outline-aas'}`}
                      onClick={() => {
                        const id = selectedSkill.id;
                        const next = { ...shortlist, [id]: !shortlist[id] };
                        setShortlist(next);
                        try { localStorage.setItem('eduskills_shortlist', JSON.stringify(next)); } catch (e) {}
                        triggerToast(next[id] ? `Đã thêm @${id} vào Shortlist! 💖` : `Đã bỏ khỏi danh sách.`);
                      }}
                    >
                      <i className={`fa-${shortlist[selectedSkill.id] ? 'solid' : 'regular'} fa-bookmark`}></i>
                      {shortlist[selectedSkill.id] ? 'In Shortlist' : 'Add to Shortlist'}
                    </button>
                    <button className="btn-aas btn-outline-aas" onClick={handleCopyPromptPayload}>
                      <i className="fa-solid fa-clipboard-check"></i> Copy Prompt 5 Khung
                    </button>
                    <button className="btn-aas btn-outline-aas" onClick={handleCopyFullContent}>
                      <i className="fa-solid fa-copy"></i> Copy Toàn Bộ File SKILL.md
                    </button>
                  </div>

                  {/* SMART MULTI-DOMAIN FILE/IMAGE UPLOAD & OCR BACKEND BOX */}
                  <div 
                    className={`smart-upload-container ${isDragOver ? 'drag-over' : ''}`}
                    onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={handleDrop}
                  >
                    <div className="upload-top-header">
                      <div className="upload-title">
                        <i className="fa-solid fa-camera-retro" style={{ color: 'var(--matcha-accent)' }}></i>
                        {currentPreset.actionHeader}
                      </div>
                      <span className="ocr-paste-badge">
                        <i className="fa-solid fa-paste"></i> Hỗ trợ phím tắt <strong>Ctrl + V</strong> dán ảnh
                      </span>
                    </div>

                    {/* Skill Sync Indicator Bar (Tự động đồng bộ theo skill được chọn ở thanh bên) */}
                    <div className="skill-sync-banner">
                      <div className="sync-status">
                        <span className="sync-dot"></span>
                        <span>Đang đồng bộ bóc tách OCR chuyên biệt theo kỹ năng:</span>
                        <strong>@{selectedSkill.id} ({selectedSkill.name})</strong>
                      </div>
                      <span className="sync-badge">
                        <i className="fa-solid fa-wand-magic-sparkles"></i> {currentPreset.standardDesc}
                      </span>
                    </div>

                    {/* Quick Demo Buttons cho riêng kỹ năng hiện tại */}
                    <div className="demo-buttons-bar">
                      <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)' }}>
                        <i className="fa-solid fa-bolt"></i> Nạp đề mẫu @{selectedSkill.id}:
                      </span>
                      {currentPreset.samples.map((sample, idx) => (
                        <button 
                          key={idx} 
                          className="btn-demo-subject" 
                          onClick={() => loadPresetSample(sample)}
                        >
                          {sample.icon} {sample.title}
                        </button>
                      ))}
                    </div>

                    <input 
                      type="file" 
                      ref={fileInputRef} 
                      style={{ display: 'none' }}
                      accept="image/*,.pdf,.txt,.md,.docx"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          processFile(e.target.files[0]);
                        }
                      }}
                    />

                    <div 
                      className="upload-drop-area" 
                      style={{ marginTop: '12px' }}
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i>
                      <p style={{ fontWeight: 800, fontSize: '0.94rem', color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                        {currentPreset.dropText}
                      </p>
                      <p style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                        {currentPreset.dropSubText}
                      </p>
                      {isOcrLoading && (
                        <div style={{ marginTop: '10px', color: 'var(--matcha-primary)', fontWeight: 700, fontSize: '0.84rem' }}>
                          <i className="fa-solid fa-spinner fa-spin"></i> Đang phân tích qua OCR Backend...
                        </div>
                      )}
                    </div>

                    {/* Multi-Domain Verification & Correction Card */}
                    {(imagePreview || extractedMathText) && (
                      <div className="math-verify-card">
                        <div className="math-verify-header">
                          <div className="math-verify-title">
                            <i className="fa-solid fa-circle-check"></i>
                            Xác Nhận & Kiểm Chứng Đề Bài
                            <span className="badge-tag-aas badge-science" style={{ marginLeft: '8px', fontSize: '0.72rem' }}>
                              {detectedBadge}
                            </span>
                          </div>
                          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                            {imagePreview && (
                              <button 
                                className="btn-aas btn-outline-aas"
                                style={{ padding: '6px 12px', fontSize: '0.76rem', borderColor: '#FFCDD2', color: '#C62828' }}
                                onClick={() => {
                                  setImagePreview('');
                                  setUploadedFile(null);
                                  triggerToast('Đã xóa ảnh chụp màn hình.');
                                }}
                              >
                                <i className="fa-solid fa-trash"></i> Xóa ảnh
                              </button>
                            )}
                            <button className="btn-verify-math" onClick={applyVerifiedMathToPrompt}>
                              <i className="fa-solid fa-arrow-down"></i> Đưa Vào Prompt Sư Phạm
                            </button>
                            <button 
                              className="btn-clear-exercise" 
                              onClick={clearExerciseFromPrompt}
                              title="Xóa toàn bộ đề bài và gỡ khỏi Prompt"
                            >
                              <i className="fa-solid fa-broom"></i> Gỡ Khỏi Prompt
                            </button>
                          </div>
                        </div>

                        {imagePreview && (
                          <div className="image-preview-wrapper">
                            <img src={imagePreview} alt="Ảnh đề bài" className="image-preview-thumb" />
                            <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>
                              <p><strong>Nguồn:</strong> {uploadedFile ? uploadedFile.name : 'Ảnh chụp màn hình'}</p>
                              <p><strong>Kích thước:</strong> {uploadedFile ? (uploadedFile.size / 1024).toFixed(1) + ' KB' : 'Clipboard buffer'}</p>
                              <span style={{ color: '#2E7D32', fontWeight: 700 }}>
                                <i className="fa-solid fa-check-double"></i> OCR Backend đã nhận diện thành công!
                              </span>
                            </div>
                          </div>
                        )}

                        {ocrInfo && (
                          <div style={{ display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap' }}>
                            <span className="badge-tag-aas badge-science" style={{ fontSize: '0.74rem' }}>
                              <i className="fa-solid fa-microchip"></i> {ocrInfo.engine}
