                  <div className="guide-step-num">1</div>
                  <div>
                    <h4 style={{ fontWeight: 800, color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                      Bước 1: Chọn Kỹ Năng & Khối Lớp Học Tập
                    </h4>
                    <p style={{ fontSize: '0.86rem', color: 'var(--text-muted)' }}>
                      Chọn môn học ở danh mục bên trái (ví dụ: <code>toan-thpt</code>, <code>hoa-hoc-thpt</code> hoặc <code>giai-chi-tiet</code>). Sau đó chọn khối Lớp 10, 11 hoặc 12.
                    </p>
                  </div>
                </div>

                <div className="guide-step-card">
                  <div className="guide-step-num">2</div>
                  <div>
                    <h4 style={{ fontWeight: 800, color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                      Bước 2: Tải Lên Ảnh Đề Bài Hoặc Kéo Thả Đề Cương
                    </h4>
                    <p style={{ fontSize: '0.86rem', color: 'var(--text-muted)' }}>
                      Chụp ảnh trang bài tập từ điện thoại hoặc kéo thả file đề cương vào khu vực Dropzone. Hệ thống tự động bóc tách và định dạng công thức toán học thành LaTeX chuẩn ($...$).
                    </p>
                  </div>
                </div>

                <div className="guide-step-card">
                  <div className="guide-step-num">3</div>
                  <div>
                    <h4 style={{ fontWeight: 800, color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                      Bước 3: Xác Nhận & Chọn Cuốn Sách Giáo Khoa Cụ Thể
                    </h4>
                    <p style={{ fontSize: '0.86rem', color: 'var(--text-muted)' }}>
                      Hệ thống tự động liên kết đến đúng cuốn SGK tương ứng trên Google Drive (ví dụ: <em>SGK Toán 12 Tập 1</em>). Bạn bấm nút <strong>"Đưa Vào Prompt Sư Phạm"</strong> để bảo chứng lời giải.
                    </p>
                  </div>
                </div>

                <div className="guide-step-card">
                  <div className="guide-step-num">4</div>
                  <div>
                    <h4 style={{ fontWeight: 800, color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                      Bước 4: Bật Các Kỹ Thuật Kích Hoạt Tư Duy Phản Biện
                    </h4>
                    <p style={{ fontSize: '0.86rem', color: 'var(--text-muted)' }}>
                      Chọn <em>Chain-of-Thought</em> (giải từng bước), <em>Socratic Method</em> (gợi mở tư duy không lộ đáp số ngay) và <em>Active Recall</em> để AI kiểm tra độ hiểu sâu của bạn.
                    </p>
                  </div>
                </div>

                <div className="guide-step-card">
                  <div className="guide-step-num">5</div>
                  <div>
                    <h4 style={{ fontWeight: 800, color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                      Bước 5: Sao Chép Prompt & Dán Vào AI Của Bạn
                    </h4>
                    <p style={{ fontSize: '0.86rem', color: 'var(--text-muted)' }}>
                      Bấm nút <strong>"Sao chép Prompt"</strong> hoặc <strong>"Lưu về máy (.md)"</strong> và dán vào Google Gemini, Claude hoặc ChatGPT. AI sẽ giải bài theo chuẩn 4 tầng Socrates không bị ảo giác!
                    </p>
                  </div>
                </div>

                <div style={{ textAlign: 'center', marginTop: '20px' }}>
                  <button 
                    className="btn-aas btn-primary-aas" 
                    style={{ margin: '0 auto' }}
                    onClick={() => {
                      setShowGuideModal(false);
                      loadDemoMath();
                    }}
                  >
                    <i className="fa-solid fa-play"></i> Dùng Thử Ngay Với Đề Toán Mẫu
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="footer-cute">
            <p>🐾 EduSkills-VN v0.1.2-beta • Chủ nhiệm dự án: <strong>Nguyễn Duy Quang</strong> (📞 0795277227 | ✉️ poiairo4628@gmail.com)</p>
            <p style={{ marginTop: '4px', fontSize: '0.76rem', color: 'var(--text-light)' }}>
              Hệ thống Kỹ Nghệ Prompt Sư Phạm chuẩn GDPT 2018 & Định dạng Đề thi BGD 2026-2027.
            </p>
          </footer>

          {/* Cute Toast Notification */}
          <div className={`cute-toast ${showToast ? 'show' : ''}`}>
            <i className="fa-solid fa-paw" style={{ color: 'var(--honey-warm)' }}></i>
            <span>{toastMsg}</span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
