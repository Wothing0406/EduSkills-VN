<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSkills-VN Matcha Hub 🍵🐾 | Nhận Diện Đề Toán LaTeX & Dẫn Chứng SGK Chuẩn BGD 2026</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- React 18 & ReactDOM & Babel for zero-build execution -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Offline Static Skills & Books Bundle -->
  <script src="./skills-data.js"></script>

  <style>
    :root {
      --bg-cream: #F7F9F6;
      --bg-card: #FFFFFF;
      --bg-matcha-subtle: #EEF4EF;
      --bg-matcha-light: #DFECE2;
      
      --matcha-primary: #385E47;
      --matcha-dark: #22382B;
      --matcha-accent: #588B69;
      --matcha-leaf: #7DAA8B;
      
      --honey-warm: #E29578;
      --honey-light: #FFDDD2;
      --strawberry-milk: #F7CAD0;
      
      --text-main: #1D2D24;
      --text-muted: #5C7164;
      --text-light: #8E9F94;
      --border-color: #E2EAE4;
      --border-focus: #588B69;
      
      --shadow-soft: 0 8px 30px rgba(56, 94, 71, 0.06);
      --shadow-hover: 0 12px 36px rgba(56, 94, 71, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Top Navbar */
    .top-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-title-group h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .brand-title-group p {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--matcha-accent);
    }

    .version-tag {
      background: var(--honey-light);
      color: #9C4221;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }

    .nav-tabs-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-tab-btn {
      background: transparent;
      border: 1.5px solid transparent;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .nav-tab-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .nav-tab-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 12px rgba(56, 94, 71, 0.2);
    }

    .btn-guide-pill {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .btn-guide-pill:hover {
      background: #FFCAB9;
      transform: translateY(-2px);
    }

    /* Layout */
    .app-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      flex: 1;
    }

    .skills-workspace-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 992px) {
      .skills-workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Sidebar: Catalog */
    .catalog-sidebar {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 90px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .search-box-cute {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box-cute i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--matcha-leaf);
      font-size: 0.95rem;
    }

    .search-input-cute {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .search-input-cute:focus {
      border-color: var(--matcha-primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(88, 139, 105, 0.15);
    }

    /* Category Pills - Clean Wrapping, zero ugly scrollbar */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      background: var(--bg-cream);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 12px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .pill-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
    }

    /* Skills Scrollable List */
    .skills-scroll-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skills-scroll-list::-webkit-scrollbar {
      width: 5px;
    }
    .skills-scroll-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .skill-card-item {
      background: var(--bg-cream);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-card-item:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
      transform: translateX(3px);
    }

    .skill-card-item.active {
      background: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 16px rgba(56, 94, 71, 0.1);
    }

    .skill-card-info h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--matcha-dark);
      margin-bottom: 2px;
    }

    .skill-card-info p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--honey-warm);
      font-weight: 600;
    }

    .badge-mini {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .badge-science { background: #E8F5E9; color: #2E7D32; }
    .badge-social { background: #EDE7F6; color: #512DA8; }
    .badge-tech { background: #E1F5FE; color: #0288D1; }
    .badge-meta { background: #FFF3E0; color: #E65100; }

    /* Workstation */
    .aas-workstation {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-soft);
    }

    .workstation-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-back-catalog {
      background: none;
      border: none;
      color: var(--matcha-accent);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-back-catalog:hover {
      background: var(--bg-matcha-subtle);
    }

    .badge-tag-aas {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .workstation-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .workstation-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 20px;
    }

    /* Action Bar */
    .aas-action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1.5px solid var(--border-color);
      margin-bottom: 28px;
    }

    .btn-aas {
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary-aas {
      background: var(--matcha-primary);
      color: white;
      border: 1.5px solid var(--matcha-primary);
    }

    .btn-primary-aas:hover {
      background: var(--matcha-dark);
      border-color: var(--matcha-dark);
      transform: translateY(-2px);
    }

    .btn-outline-aas {
      background: white;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline-aas:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
    }

    .btn-honey-aas {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
    }

    .btn-honey-aas:hover {
      background: #FFCAB9;
    }

    /* SMART DROPZONE & MATH OCR SECTION */
    .smart-upload-container {
      background: #FAFBF9;
      border: 2px dashed var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 28px;
      transition: all 0.2s;
    }

    .smart-upload-container.drag-over {
      background: #E8F5E9;
      border-color: var(--matcha-primary);
    }

    .upload-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .upload-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-drop-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: white;
      border: 1.5px dashed var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .upload-drop-area:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-matcha-subtle);
    }

    .domain-selector-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: center;
    }

    .domain-pill-btn {
      background: white;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .domain-pill-btn:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-cream);
    }

    .domain-pill-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 2px 8px rgba(56, 94, 71, 0.25);
    }

    .demo-buttons-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    .btn-demo-subject {
      background: white;
      border: 1px solid #C8E6C9;
      color: #2E7D32;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-demo-subject:hover {
      background: #E8F5E9;
      transform: translateY(-1px);
    }

    .ocr-paste-badge {
      background: #FFF3E0;
      border: 1px solid #FFE082;
      color: #E65100;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Image Preview & Extracted Math Verification Box */
    .math-verify-card {
      background: white;
      border: 1.5px solid #A5D6A7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 4px 16px rgba(46, 125, 50, 0.08);
    }

    .math-verify-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .math-verify-title {
      font-weight: 800;
      color: #1B5E20;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .image-preview-wrapper {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .image-preview-thumb {
      max-width: 140px;
      max-height: 100px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      object-fit: cover;
    }

    .btn-verify-math {
      background: #2E7D32;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-verify-math:hover {
      background: #1B5E20;
      transform: translateY(-2px);
    }

    /* 5-Part Modern Prompt Builder Card */
    .prompt-builder-card {
      background: #FAFCF9;
      border: 2px solid var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(56, 94, 71, 0.05);
    }

    .builder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .builder-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .builder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .builder-grid {
        grid-template-columns: 1fr;
      }
    }

    .builder-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .builder-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--matcha-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .builder-input, .builder-select {
      width: 100%;
      padding: 9px 12px;
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .builder-input:focus, .builder-select:focus, .builder-textarea:focus {
      border-color: var(--matcha-primary);
      box-shadow: 0 0 0 3px rgba(88, 139, 105, 0.12);
    }

    .builder-textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      resize: vertical;
    }

    /* Specific Textbook Citation Box */
    .specific-book-box {
      background: #E8F5E9;
      border: 1.5px solid #81C784;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .book-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .book-box-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: #1B5E20;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Cognitive Toggles */
    .cognitive-toggles-box {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 16px;
    }

    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .toggle-item input[type="checkbox"] {
      accent-color: var(--matcha-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Live Output Box */
    .live-payload-section {
      background: #1B2820;
      border-radius: var(--radius-md);
      padding: 16px;
      position: relative;
    }

    .payload-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .payload-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #A5D6A7;
      font-weight: 600;
    }

    .live-code-area {
      color: #E8F5E9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.6;
    }

    /* Interactive User Guide Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 780px;
      width: 100%;
      max-height: 90vh;

    .footer-cute {
      text-align: center;
      padding: 24px;
      font-size: 0.82rem;

      color: var(--text-muted);

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Fallback static catalog if offline
    const DEFAULT_CATALOG = (typeof window !== 'undefined' && window.EDUSKILLS_CATALOG) ? window.EDUSKILLS_CATALOG : [];
    const BOOKS_DATABASE = (typeof window !== 'undefined' && window.EDUSKILLS_BOOKS) ? window.EDUSKILLS_BOOKS : {};

    const DRIVE_LINKS_MAP = {
      10: {
        grade: 10,
        title: 'Sách Giáo Khoa Lớp 10 (GDPT 2018)',
        url: 'https://drive.google.com/drive/folders/1H4BU2OMP1h5VJUtF8iQp9Dpmo40oHX6o?usp=drive_link',
        badge: 'Đầy đủ các bộ sách chuẩn GDPT 2018'
      },
      11: {
        grade: 11,
        title: 'Sách Giáo Khoa Lớp 11 (Bản Chuẩn Hóa BGD)',
        url: 'https://drive.google.com/drive/folders/1w8QOaRc_V5It9Xh0PvT_QwO_G7V22jZr?usp=drive_link',
        badge: 'Bản chuẩn hóa Bộ GD&ĐT'
      },
      12: {
        grade: 12,
        title: 'Sách Giáo Khoa Lớp 12 (SGK Thống Nhất 2026-2027)',
        url: 'https://drive.google.com/drive/folders/1I3h4nfdJTO5KdPsD4UWYdYJlMXQL1YwD?usp=drive_link',
        badge: 'Trọng tâm thi THPT Quốc Gia'
      }
    };

    // Multi-Domain Educational Parser & Formatter (Offline Fallback & Client Utility)
    function formatMathProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '\\frac{$1}{$2}');
      text = text.replace(/([a-zA-Z0-9_]+)\/([a-zA-Z0-9_]+)/g, '\\frac{$1}{$2}');
      text = text.replace(/\^([0-9a-zA-Z\+\-]+)/g, '^{$1}');
      text = text.replace(/(?:sqrt|căn)\(([^)]+)\)/gi, '\\sqrt{$1}');
      text = text.replace(/(?:sqrt|căn)\s*([a-zA-Z0-9]+)/gi, '\\sqrt{$1}');
      text = text.replace(/lim\s*x\s*->\s*(\+?oo|\+?inf)/gi, '\\lim_{x \\to +\\infty}');
      text = text.replace(/lim\s*x\s*->\s*(-oo|-inf)/gi, '\\lim_{x \\to -\\infty}');
      text = text.replace(/vec\(([a-zA-Z]+)\)/gi, '\\vec{$1}');
      text = text.replace(/int_([0-9a-zA-Z]+)\^([0-9a-zA-Z]+)/g, '\\int_{$1}^{$2}');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatPhysicsProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/\b(m\/s2|m\/s\^2)\b/g, '$\\text{m/s}^2$');
      text = text.replace(/\b(m\/s)\b/g, '$\\text{m/s}$');
      text = text.replace(/([0-9]+)\s*K\b/g, '$1\\text{ K}');
      text = text.replace(/([0-9]+)\s*oC\b/gi, '$1^\\circ\\text{C}');
      text = text.replace(/([0-9]+)\s*Pa\b/g, '$1\\text{ Pa}');
      text = text.replace(/([0-9]+)\s*atm\b/g, '$1\\text{ atm}');
      text = text.replace(/([0-9]+)\s*N\b/g, '$1\\text{ N}');
      text = text.replace(/([0-9]+)\s*J\b/g, '$1\\text{ J}');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatChemistryProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      const dict = [
        { vn: /axit\s+axetic/gi, iupac: 'ethanoic acid (acetic acid)' },
        { vn: /axit\s+sunfuric/gi, iupac: 'sulfuric acid (H2SO4)' },
        { vn: /axit\s+clohidric/gi, iupac: 'hydrochloric acid (HCl)' },
        { vn: /axit\s+nitric/gi, iupac: 'nitric acid (HNO3)' },
        { vn: /ancol\s+etylic/gi, iupac: 'ethanol (C2H5OH)' },
        { vn: /glucozo/gi, iupac: 'glucose (C6H12O6)' },
        { vn: /\bđồng\b/gi, iupac: 'copper (Cu)' },
        { vn: /\bsắt\b/gi, iupac: 'iron (Fe)' },
        { vn: /\bnhôm\b/gi, iupac: 'aluminium (Al)' },
        { vn: /\bnatri\b/gi, iupac: 'sodium (Na)' }
      ];
      dict.forEach(item => { text = text.replace(item.vn, item.iupac); });
      text = text.replace(/->|-->/g, ' $\\rightarrow$ ');
      text = text.replace(/Delta\s*r\s*H\s*0\s*298/gi, '$\\Delta_r H^0_{298}$');
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');
      return text;
    }

    function formatLiteratureProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      if (!text.includes('PHẦN ĐỌC HIỂU')) {
        text = `### I. PHẦN ĐỌC HIỂU (4,0 điểm)\n\n**1. Ngữ liệu trích dẫn:**\n${text}\n\n**2. Hệ thống câu hỏi:**\n- **Câu 1:** Xác định thể thơ / phương thức biểu đạt chính.\n- **Câu 2:** Chỉ ra và nêu tác dụng của biện pháp tu từ nổi bật.\n- **Câu 3:** Rút ra bài học / thông điệp ý nghĩa nhất.\n\n### II. PHẦN LÀM VĂN (6,0 điểm)\n- **Câu 1 (2,0đ):** Viết đoạn văn nghị luận xã hội khoảng 200 chữ.\n- **Câu 2 (4,0đ):** Viết bài văn nghị luận phân tích sâu sắc ngữ liệu trên.`;
      }
      return text;
    }

    function formatProblemBySubject(rawText, subject) {
      switch (subject) {
        case 'toan-thpt': return { formatted: formatMathProblem(rawText), badge: '📐 Toán học • LaTeX Chuẩn Quốc Tế' };
        case 'vat-li-thpt': return { formatted: formatPhysicsProblem(rawText), badge: '⚡ Vật lí • Đơn Vị SI Chuẩn' };
        case 'hoa-hoc-thpt': return { formatted: formatChemistryProblem(rawText), badge: '🧪 Hóa học • 100% IUPAC Tiếng Anh' };
        case 'ngu-van-thpt': return { formatted: formatLiteratureProblem(rawText), badge: '📖 Ngữ văn • Đọc Hiểu & NLXH 200 Chữ' };
        default: return { formatted: formatMathProblem(rawText), badge: '📚 Đa Môn THPT • Chuẩn GDPT 2018' };
      }
    }

    function App() {
      const [skills, setSkills] = useState(DEFAULT_CATALOG);
      const [selectedSkillId, setSelectedSkillId] = useState('toan-thpt');
      const [activeTab, setActiveTab] = useState('skills'); // skills | drive | prompt-standard | guide
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [shortlist, setShortlist] = useState({});
      const [toastMsg, setToastMsg] = useState('');
      const [showToast, setShowToast] = useState(false);
      const [showGuideModal, setShowGuideModal] = useState(false);

      // --- Multi-Domain & OCR State ---
      const [activeDomain, setActiveDomain] = useState('toan-thpt'); // toan-thpt | vat-li-thpt | hoa-hoc-thpt | ngu-van-thpt
      const [detectedBadge, setDetectedBadge] = useState('📐 Toán học • LaTeX Chuẩn Quốc Tế');
      const [isOcrLoading, setIsOcrLoading] = useState(false);

      // --- 5-Part Modern Prompt Builder State (docs/Tieuchuanprompt.md) ---
      const [rolePrompt, setRolePrompt] = useState('Gia sư Sư phạm Toán THPT chuẩn BGD 2026');
      const [gradeLevel, setGradeLevel] = useState(12);
      const [studentLevel, setStudentLevel] = useState('Khá - Giỏi (Mục tiêu 8.5+ THPT Quốc Gia)');
      const [currentStatus, setCurrentStatus] = useState('Đã nắm được phần lý thuyết cơ bản nhưng chưa vững phần bẫy trắc nghiệm');
      const [taskPrompt, setTaskPrompt] = useState('Phân tích bản chất, giải bài từng bước và chỉ ra 3 bẫy sai lầm kinh điển');
      const [constraintsPrompt, setConstraintsPrompt] = useState('Trình bày bằng LaTeX chuẩn ($...$), chia bảng so sánh, kiểm tra nghiệm');
      
      // Cognitive Toggles
      const [useCoT, setUseCoT] = useState(true);
      const [useSocratic, setUseSocratic] = useState(true);
      const [useFewShot, setUseFewShot] = useState(false);
      const [useActiveRecall, setUseActiveRecall] = useState(true);
      
      // Specific Book Selection
      const [selectedBookFile, setSelectedBookFile] = useState('');

      // Document / Exercise Attachment & Upload
      const [docAttachment, setDocAttachment] = useState('');
      const [uploadedFile, setUploadedFile] = useState(null);
      const [imagePreview, setImagePreview] = useState('');
      const [extractedMathText, setExtractedMathText] = useState('');
      const [isDragOver, setIsDragOver] = useState(false);
      const fileInputRef = useRef(null);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2600);
      };

      // Load Catalog from API (with fallback)
      useEffect(() => {
        fetch('/api/skills')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setSkills(data);
            }
          })
          .catch(() => {
            if (window.EDUSKILLS_CATALOG) setSkills(window.EDUSKILLS_CATALOG);
          });

        try {
          const saved = localStorage.getItem('eduskills_shortlist');
          if (saved) setShortlist(JSON.parse(saved));
        } catch (e) {}
      }, []);

      const selectedSkill = useMemo(() => {
        return skills.find(s => s.id === selectedSkillId) || skills[0] || {};
      }, [skills, selectedSkillId]);

      // Auto synchronize domain when core skill is selected
      useEffect(() => {
        if (['toan-thpt', 'vat-li-thpt', 'hoa-hoc-thpt', 'ngu-van-thpt'].includes(selectedSkillId)) {
          setActiveDomain(selectedSkillId);
        }
      }, [selectedSkillId]);

      // Get available specific books for current skill and grade
      const availableBooks = useMemo(() => {
        const skillBooks = BOOKS_DATABASE[selectedSkill.id] || BOOKS_DATABASE[activeDomain] || BOOKS_DATABASE['toan-thpt'] || {};
        return skillBooks[gradeLevel] || [];
      }, [selectedSkill, activeDomain, gradeLevel]);

      // Set default book file when grade or skill changes
      useEffect(() => {
        if (availableBooks.length > 0) {
          setSelectedBookFile(availableBooks[0].file);
        } else {
          setSelectedBookFile('');
        }
      }, [availableBooks]);

      const currentBookObject = useMemo(() => {
        return availableBooks.find(b => b.file === selectedBookFile) || availableBooks[0] || null;
      }, [availableBooks, selectedBookFile]);

      // Auto update role prompt when skill changes
      useEffect(() => {
        if (!selectedSkill.name) return;
        const subjectMap = {
          'toan-thpt': 'Chuyên gia Sư phạm Toán THPT chuẩn GDPT 2018 & Đề thi BGD 2026',
          'vat-li-thpt': 'Gia sư Vật lí THPT chuyên sâu Vật lí nhiệt, Khí lí tưởng & Đơn vị SI',
          'hoa-hoc-thpt': 'Chuyên gia Hóa học IUPAC 100% tiếng Anh chuẩn SGK mới',
          'sinh-hoc-thpt': 'Cố vấn Sinh học THPT chuyên sâu Di truyền phân tử & Phả hệ',
          'ngu-van-thpt': 'Giáo viên Ngữ văn THPT chuyên luyện Đọc hiểu ngoài SGK & NLXH 200 chữ',
          'giai-chi-tiet': 'Gia sư Sư phạm Đa Tầng Socrates (Khơi mở tư duy, không lộ đáp số ngay)',
          'tao-quiz-bgd': 'Chuyên gia khảo thí thiết kế đề thi 3 phần chuẩn QĐ 764/QĐ-BGDĐT',
          'slide-thuyet-trinh': 'Presentation Architect chuyên thiết kế slide Marp 16:9 chuẩn sư phạm',
          'tomtat-mindmap': 'Chuyên gia Siêu Trí Nhớ & Sơ đồ tư duy Mermaid Cornell 60 giây',
          'luan-an-nghiencuu': 'Cố vấn Nghiên cứu Khoa học Kỹ thuật THPT (Hội thi ViSEF)'
        };
        setRolePrompt(subjectMap[selectedSkill.id] || `Chuyên gia giảng dạy môn ${selectedSkill.name} THPT`);
      }, [selectedSkill]);

      // Filtered Skills
      const filteredSkills = useMemo(() => {
        return skills.filter(item => {
          const matchCat = selectedCategory === 'all' || item.category === selectedCategory;
          const matchQuery = (item.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                             (item.description || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                             (item.id && item.id.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchCat && matchQuery;
        });
      }, [skills, selectedCategory, searchQuery]);

      // --- GLOBAL CLIPBOARD PASTE LISTENER (Ctrl + V Screenshots) ---
      useEffect(() => {
        const handlePaste = (e) => {
          if (!e.clipboardData || !e.clipboardData.items) return;
          for (let i = 0; i < e.clipboardData.items.length; i++) {
            const item = e.clipboardData.items[i];
            if (item.type.indexOf('image') !== -1) {
              const file = item.getAsFile();
              if (file) {
                processFile(file, 'Ảnh chụp màn hình (Clipboard Ctrl+V)');
                triggerToast('Đã dán ảnh bài tập từ Clipboard (Ctrl + V)! 📸🐾');
                e.preventDefault();
                break;
              }
            }
          }
        };
        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [activeDomain, gradeLevel]);

      // --- INTENT-DRIVEN PROMPT GENERATOR (4 CLEAR PILLARS) ---
      const generatedPromptPayload = useMemo(() => {
        const driveInfo = DRIVE_LINKS_MAP[gradeLevel] || DRIVE_LINKS_MAP[12];
        const bookTitle = currentBookObject ? currentBookObject.title : `Sách Giáo Khoa Lớp ${gradeLevel}`;
        const bookFile = currentBookObject ? currentBookObject.file : 'Tài liệu SGK chuẩn';
        const bookDrive = currentBookObject ? currentBookObject.drive : driveInfo.url;
        
        let p = `# ==============================================================================\n`;
        p += `# 🍵 EDUSKILLS-VN INTENT-DRIVEN PROMPT (CHUẨN TIEUCHUANPROMPT.MD & BGD 2026)\n`;
        p += `# ==============================================================================\n\n`;

        p += `## 🎯 1. MỤC TIÊU & NHIỆM VỤ THỰC THI (WHAT THIS PROMPT DOES)\n`;
        p += `- **Vai trò sư phạm:** ${rolePrompt}.\n`;
        p += `- **Nhiệm vụ cụ thể:** ${taskPrompt}.\n`;
        p += `- **Hành động sư phạm bắt buộc:**\n`;
        if (useCoT) p += `  * [Chain-of-Thought]: Giải thích bản chất từng bước (step-by-step) trước khi kết luận.\n`;
        if (useSocratic) p += `  * [Socratic Method]: Đặt câu hỏi gợi mở để người học tự động não, không đưa ngay đáp số thô.\n`;
        if (useFewShot) p += `  * [Few-shot]: Minh họa bằng 1 ví dụ tương đương theo phong cách chuẩn mực.\n`;
        if (useActiveRecall) p += `  * [Active Recall]: Ở cuối bài giải, BẮT BUỘC đặt 1 câu hỏi kiểm tra tư duy phản biện hoặc bài tập tương tự.\n`;

        p += `\n## 🧠 2. CƠ SỞ NHẬN THỨC & BỐI CẢNH (WHAT THE AI MUST UNDERSTAND)\n`;
        p += `- **Đối tượng người học:** Học sinh Lớp ${gradeLevel}, theo học Chương trình GDPT 2018.\n`;
        p += `- **Trình độ & Năng lực:** "${studentLevel}".\n`;
        p += `- **Tình trạng nhận thức:** ${currentStatus}.\n`;
        p += `- **Bẫy phòng thi cần cảnh báo:** Quên điều kiện xác định, nhầm đơn vị chuẩn SI, sai danh pháp IUPAC hoặc lỗi suy luận trắc nghiệm.\n`;

        p += `\n## 📖 3. DẪN CHỨNG & CHỈ DẪN CÓ CHỦ ĐÍCH (INTENTIONAL GROUNDING & CITATIONS)\n`;
        p += `- **Sách Giáo Khoa chỉ định:** ${bookTitle}\n`;
        p += `- **Mã File PDF Gốc tham chiếu:** \`${bookFile}\`\n`;
        p += `- **Thư mục Google Drive trực tiếp:** ${bookDrive}\n`;
        p += `- **CHỈ DẪN BẮT BUỘC ĐỐI SOÁT:**\n`;
        p += `  1. Mọi công thức, định lý, định luật và phương pháp giải ĐỀU PHẢI TRÍCH DẪN VÀ ĐỐI CHIẾU TRỰC TIẾP từ cuốn sách giáo khoa trên.\n`;
        p += `  2. TUYỆT ĐỐI CẤM sử dụng các công thức ngoài chương trình hoặc các thuật toán mẹo làm mất đi bản chất khoa học.\n`;
        p += `  3. Hãy chỉ rõ tên chương/bài học cụ thể trong SGK để học sinh có thể mở sách tra cứu lại ngay lập tức.\n`;

        p += `\n## ⚡ 4. RÀNG BUỘC KỸ THUẬT & ĐỊNH DẠNG ĐẦU RA (OUTPUT CONSTRAINTS & FORMAT)\n`;
        p += `- ${constraintsPrompt}.\n`;
        p += `- Tuân thủ nghiêm ngặt Barem điểm lũy tiến và định dạng đề thi 3 phần của Bộ GD&ĐT (Quyết định 764/QĐ-BGDĐT).\n`;
        p += `- Cấu trúc trả lời 4 tầng Socrates:\n`;
        p += `  * **Tầng 1:** Gợi Mở Tư Duy Socrates (Socratic Clue - Không lộ đáp số).\n`;
        p += `  * **Tầng 2:** Bản Chất Lý Thuyết & Chiến Thuật Tiếp Cận Tối Ưu.\n`;
        p += `  * **Tầng 3:** Lời Giải Chi Tiết Từng Bước (Full Step-by-Step, có lập luận cho từng phép biến đổi).\n`;
        p += `  * **Tầng 4:** Giải Mã Bẫy Phòng Thi & 1 Bài Tập Tự Luyện Tương Tự.\n`;

        if (docAttachment.trim()) {
          p += `\n## 📝 5. NỘI DUNG ĐỀ BÀI / NGỮ LIỆU ĐÃ XÁC NHẬN KIỂM CHỨNG\n`;
          p += `\`\`\`text\n${docAttachment.trim()}\n\`\`\`\n\n`;
          p += `👉 Bắt đầu phân tích và giải quyết bài toán theo đầy đủ 4 tầng sư phạm trên:`;
        }

        return p;
      }, [rolePrompt, gradeLevel, studentLevel, currentStatus, taskPrompt, constraintsPrompt, useCoT, useSocratic, useFewShot, useActiveRecall, currentBookObject, docAttachment]);

      // --- Handle File & Image Upload with OCR Backend ---
      const processFile = (file, customName) => {
        if (!file) return;
        setUploadedFile(file);
        setIsOcrLoading(true);

        const fileName = customName || file.name || 'de-bai-tap.png';

        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const dataUrl = e.target.result;
            setImagePreview(dataUrl);

            // Gửi lên Backend /api/ocr
            try {
              const res = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  image: dataUrl,
                  subject: activeDomain,
                  grade: gradeLevel,
                  fileName: fileName,
                  fileType: file.type
                })
              });
              const data = await res.json();
              if (data.success && data.formattedText) {
                setExtractedMathText(data.formattedText);
                setDetectedBadge(data.domainBadge || 'Đã nhận diện qua OCR');
                triggerToast(`⚡ OCR Backend đã bóc tách & chuẩn hóa "${fileName}"! 🐾`);
              } else {
                throw new Error('Fallback offline parser');
              }
            } catch (err) {
              // Fallback client-side parser
              const clientResult = formatProblemBySubject(
                `Cho bài tập nhận diện từ ảnh "${fileName}".\n1. Xác định điều kiện và viết công thức toán/hóa/lý.\n2. Giải chi tiết từng bước.`,
                activeDomain
              );
              setExtractedMathText(clientResult.formatted);
              setDetectedBadge(clientResult.badge);
              triggerToast(`Đã nhận diện ảnh đề bài "${fileName}" (Offline mode)! 📷🐾`);
            } finally {
              setIsOcrLoading(false);
            }
          };
          reader.readAsDataURL(file);
        } else {
          // Document / Text / PDF
          setImagePreview('');
          const reader = new FileReader();
          reader.onload = async (e) => {
            const rawContent = e.target.result;
            try {
              const res = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: rawContent,
                  subject: activeDomain,
                  grade: gradeLevel,
                  fileName: fileName,
                  fileType: file.type
                })
              });
              const data = await res.json();
              if (data.success && data.formattedText) {
                setExtractedMathText(data.formattedText);
                setDetectedBadge(data.domainBadge || 'Đã định dạng');
                triggerToast(`⚡ Đã phân tích tài liệu "${fileName}" qua OCR Backend! 📄`);
              } else {
                throw new Error('Fallback offline parser');
              }
            } catch (err) {
              const clientResult = formatProblemBySubject(rawContent, activeDomain);
              setExtractedMathText(clientResult.formatted);
              setDetectedBadge(clientResult.badge);
              triggerToast(`Đã đọc nội dung tài liệu "${fileName}"! 📄`);
            } finally {
              setIsOcrLoading(false);
            }
          };
          reader.readAsText(file);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      // Transfer verified exercise into Prompt
      const applyVerifiedMathToPrompt = () => {
        if (!extractedMathText.trim()) return;
        setDocAttachment(extractedMathText.trim());
        triggerToast('Đã xác nhận & nạp đề bài vào Prompt Sư Phạm! ✅');
      };

      // Load Quick Sample Demos for 4 subjects
      const loadDemoQuestion = (subjectKey) => {
        setActiveDomain(subjectKey);
        let sample = '';
        if (subjectKey === 'toan-thpt') {
          sample = `Cho hàm số $y = \\frac{2x - 1}{x + 1}$.\n1. Tìm tập xác định $D$ và các đường tiệm cận đứng, tiệm cận ngang của đồ thị hàm số.\n2. Tìm các khoảng đơn điệu và vẽ bảng biến thiên của hàm số.\nA. Tiệm cận đứng $x = -1$, tiệm cận ngang $y = 2$\nB. Tiệm cận đứng $x = 1$, tiệm cận ngang $y = -1$\nC. Tiệm cận đứng $x = -1$, tiệm cận ngang $y = -1$\nD. Hàm số không có tiệm cận`;
          setDetectedBadge('📐 Toán học • LaTeX Chuẩn Quốc Tế');
          triggerToast('Đã nạp bài toán mẫu hàm số & tiệm cận! 📐');
        } else if (subjectKey === 'vat-li-thpt') {
          sample = `Một khối khí lí tưởng có thể tích 4 lít ở nhiệt độ $27^\\circ\\text{C}$ ($300\\text{ K}$) và áp suất $1\\text{ atm}$ ($101325\\text{ Pa}$) được dãn nở đẳng nhiệt đến thể tích 8 lít.\n1. Tính áp suất $p_2$ của khối khí sau khi dãn nở đẳng nhiệt (đổi sang đơn vị $\\text{Pa}$).\n2. Tính nhiệt lượng $Q$ mà khối khí nhận được trong quá trình trên (biết $\\Delta U = A + Q$).\nA. $p_2 = 0.5\\text{ atm} = 50662.5\\text{ Pa}$\nB. $p_2 = 2\\text{ atm} = 202650\\text{ Pa}$\nC. $p_2 = 1\\text{ atm} = 101325\\text{ Pa}$\nD. $p_2 = 0.25\\text{ atm} = 25331\\text{ Pa}`;
          setDetectedBadge('⚡ Vật lí • Đơn Vị SI Chuẩn');
          triggerToast('Đã nạp bài tập Vật lí mẫu (Khí lí tưởng)! ⚡');
        } else if (subjectKey === 'hoa-hoc-thpt') {
          sample = `Hòa tan hoàn toàn $m$ gam bột copper (Cu) trong dung dịch nitric acid (HNO3) loãng, dư sinh ra 4.958 lít khí nitrogen monoxide (NO) ở điều kiện chuẩn ($25^\\circ\\text{C}, 1\\text{ bar}$) là sản phẩm khử duy nhất.\n1. Viết phương trình hóa học và gọi tên $100\\%$ chất theo danh pháp IUPAC tiếng Anh.\n2. Tính giá trị của $m$ (biết $\\text{Cu} = 64, \\text{N} = 14, \\text{O} = 16$).\n3. Tính biến thiên Enthalpy chuẩn $\\Delta_r H^0_{298}$ của phản ứng.`;
          setDetectedBadge('🧪 Hóa học • 100% IUPAC Tiếng Anh');
          triggerToast('Đã nạp bài tập Hóa học mẫu IUPAC! 🧪');
        } else if (subjectKey === 'ngu-van-thpt') {
          sample = `### I. PHẦN ĐỌC HIỂU (4,0 điểm)\n\n**Ngữ liệu trích dẫn:**\n"Dù ai đi ngược về xuôi\nNhớ ngày Giỗ Tổ mùng mười tháng ba\nKhắp miền truyền mãi câu ca\nNước non vẹn một dải hòa bình tâm."\n\n**Hệ thống câu hỏi:**\n- **Câu 1:** Xác định thể thơ và phương thức biểu đạt chính.\n- **Câu 2:** Chỉ ra và nêu tác dụng của biện pháp tu từ trong hai câu đầu.\n- **Câu 3:** Rút ra thông điệp sâu sắc nhất về đạo lý "Uống nước nhớ nguồn".\n\n### II. PHẦN LÀM VĂN (6,0 điểm)\n- **Câu 1 (2,0đ):** Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý thức gìn giữ nguồn cội của thế hệ trẻ hôm nay.`;
          setDetectedBadge('📖 Ngữ văn • Đọc Hiểu & NLXH 200 Chữ');
          triggerToast('Đã nạp đề Đọc hiểu Ngữ văn mẫu! 📖');
        }
        setExtractedMathText(sample);
        setDocAttachment(sample);
      };

      // --- Offline Downloads & Copies ---
      const handleDownloadSkillMd = () => {
        try {
          const content = selectedSkill.rawContent || `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${selectedSkill.id || 'skill'}.SKILL.md`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          triggerToast(`Đã tải file ${selectedSkill.id}.SKILL.md về máy! 💾🐾`);
        } catch (e) {
          triggerToast(`Lỗi: ${e.message}`);
        }
      };

      const handleCopyPromptPayload = async () => {
        try {
          await navigator.clipboard.writeText(generatedPromptPayload);
          triggerToast(`Đã sao chép Prompt chuẩn Tieuchuanprompt.md! 📋✨`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      const handleCopyFullContent = async () => {
        try {
          let text = selectedSkill.rawContent || '';
          if (!text) {
            text = `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          } else {
            text += `\n\n========================================\n[PROMPT SƯ PHẠM ĐÍNH KÈM TỪ EDUSKILLS-VN]:\n${generatedPromptPayload}\n========================================\n`;
          }
          await navigator.clipboard.writeText(text);
          triggerToast(`Đã sao chép toàn bộ Master Playbook ${selectedSkill.id}.SKILL.md! 🍵`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      return (
        <div>
          {/* Top Navbar */}
          <header className="top-navbar">
            <div className="brand-section" onClick={() => setActiveTab('skills')}>
              <svg className="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="#588B69" />
                <path d="M28 35L36 18L44 32" fill="#E29578" />
                <path d="M72 35L64 18L56 32" fill="#E29578" />
                <circle cx="50" cy="52" r="32" fill="#FFFFFF" />
                <ellipse cx="40" cy="48" rx="4" ry="5" fill="#22382B" />
                <ellipse cx="60" cy="48" rx="4" ry="5" fill="#22382B" />
                <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF" />
                <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF" />
                <path d="M48 54L52 54L50 57Z" fill="#E29578" />
                <path d="M46 59C48 61 52 61 54 59" stroke="#22382B" strokeWidth="2" strokeLinecap="round" />
                <ellipse cx="33" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <ellipse cx="67" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <path d="M38 72H62C62 72 60 84 50 84C40 84 38 72 38 72Z" fill="#385E47" />
                <ellipse cx="50" cy="72" rx="12" ry="3" fill="#7DAA8B" />
              </svg>
              <div className="brand-title-group">
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <h1>EduSkills-VN</h1>
                  <span className="version-tag">v0.1.2-beta</span>
                </div>
                <p>🍵 Matcha Mèo Ú • Nhận Diện Đề Toán & Dẫn Chứng SGK Chuẩn</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="nav-tabs-group">
              <button 
                className={`nav-tab-btn ${activeTab === 'skills' ? 'active' : ''}`}
                onClick={() => setActiveTab('skills')}
              >
                <i className="fa-solid fa-graduation-cap"></i> 16 Kỹ Năng THPT
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'drive' ? 'active' : ''}`}
                onClick={() => setActiveTab('drive')}
              >
                <i className="fa-brands fa-google-drive"></i> Tủ Sách SGK Cloud
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'prompt-standard' ? 'active' : ''}`}
                onClick={() => setActiveTab('prompt-standard')}
              >
                <i className="fa-solid fa-scroll"></i> Tiêu Chuẩn Prompt Mạnh
              </button>
              <button 
                className="btn-guide-pill"
                onClick={() => setShowGuideModal(true)}
              >
                <i className="fa-solid fa-circle-question"></i> Hướng Dẫn Sử Dụng
              </button>
            </div>
          </header>

          {/* Main App Container */}
          <main className="app-container">
            {/* VIEW 1: SKILLS & WORKSTATION */}
            {activeTab === 'skills' && (
              <div className="skills-workspace-grid">
                {/* Left: Sidebar Catalog */}
                <aside className="catalog-sidebar">
                  <div className="search-box-cute">
                    <i className="fa-solid fa-magnifying-glass"></i>
                    <input 
                      type="text" 
                      className="search-input-cute" 
                      placeholder="Tìm môn học (/toan, /hoa, /quiz)..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>

                  {/* Category Pills - Clean Wrapping */}
                  <div className="category-pills">
                    {[
                      { id: 'all', label: 'Tất cả (16)' },
                      { id: 'khoa-hoc-tu-nhien', label: 'Tự nhiên' },
                      { id: 'khoa-hoc-xa-hoi', label: 'Xã hội' },
                      { id: 'ngon-ngu-cong-nghe', label: 'Công nghệ' },
                      { id: 'meta-tools', label: 'Meta-tools' }
                    ].map(cat => (
                      <button 
                        key={cat.id} 
                        className={`pill-btn ${selectedCategory === cat.id ? 'active' : ''}`}
                        onClick={() => setSelectedCategory(cat.id)}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>

                  {/* Skills Scrollable List */}
                  <div className="skills-scroll-list">
                    {filteredSkills.map(skill => {
                      const isSelected = skill.id === selectedSkill.id;
                      const isFav = !!shortlist[skill.id];
                      return (
                        <div 
                          key={skill.id} 
                          className={`skill-card-item ${isSelected ? 'active' : ''}`}
                          onClick={() => setSelectedSkillId(skill.id)}
                        >
                          <div className="skill-card-info">
                            <h4>{skill.name}</h4>
                            <p>@{skill.id} {isFav ? '💖' : ''}</p>
                          </div>
                          <span className={`badge-mini ${
                            skill.category === 'khoa-hoc-tu-nhien' ? 'badge-science' :
                            skill.category === 'khoa-hoc-xa-hoi' ? 'badge-social' :
                            skill.category === 'ngon-ngu-cong-nghe' ? 'badge-tech' : 'badge-meta'
                          }`}>
                            {skill.category ? skill.category.split('-')[0].toUpperCase() : 'SKILL'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </aside>

                {/* Right: AAS Core Workstation */}
                <section className="aas-workstation">
                  <div className="workstation-breadcrumb">
                    <button className="btn-back-catalog" onClick={() => setSelectedCategory('all')}>
                      <i className="fa-solid fa-arrow-left"></i> Danh mục kỹ năng
                    </button>
                    <span className="badge-tag-aas badge-science">
                      {selectedSkill.category || 'AAS CORE'}
                    </span>
                    <span className="badge-tag-aas badge-meta">
                      v0.1.2-beta
                    </span>
                    <span className="badge-tag-aas badge-tech">
                      GDPT 2018 • BGD 2026
                    </span>
                  </div>

                  <div className="workstation-header">
                    <div className="workstation-title">
                      @{selectedSkill.id}
                      {shortlist[selectedSkill.id] && <span style={{ fontSize: '1.4rem' }}>💖</span>}
                    </div>
                    <p className="workstation-desc">{selectedSkill.description}</p>
                  </div>

                  {/* Action Bar */}
                  <div className="aas-action-bar">
                    <button className="btn-aas btn-primary-aas" onClick={handleDownloadSkillMd}>
                      <i className="fa-solid fa-download"></i> Lưu về máy (.md)
                    </button>
                    <button 
                      className={`btn-aas ${shortlist[selectedSkill.id] ? 'btn-honey-aas' : 'btn-outline-aas'}`}
                      onClick={() => {
                        const id = selectedSkill.id;
                        const next = { ...shortlist, [id]: !shortlist[id] };
                        setShortlist(next);
                        try { localStorage.setItem('eduskills_shortlist', JSON.stringify(next)); } catch (e) {}
                        triggerToast(next[id] ? `Đã thêm @${id} vào Shortlist! 💖` : `Đã bỏ khỏi danh sách.`);
                      }}
                    >
                      <i className={`fa-${shortlist[selectedSkill.id] ? 'solid' : 'regular'} fa-bookmark`}></i>
                      {shortlist[selectedSkill.id] ? 'In Shortlist' : 'Add to Shortlist'}
                    </button>
                    <button className="btn-aas btn-outline-aas" onClick={handleCopyPromptPayload}>
                      <i className="fa-solid fa-clipboard-check"></i> Copy Prompt 5 Khung
                    </button>
                    <button className="btn-aas btn-outline-aas" onClick={handleCopyFullContent}>
                      <i className="fa-solid fa-copy"></i> Copy Toàn Bộ File SKILL.md
                    </button>
                  </div>

                  {/* SMART MULTI-DOMAIN FILE/IMAGE UPLOAD & OCR BACKEND BOX */}
                  <div 
                    className={`smart-upload-container ${isDragOver ? 'drag-over' : ''}`}
                    onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={handleDrop}
                  >
                    <div className="upload-top-header">
                      <div className="upload-title">
                        <i className="fa-solid fa-camera-retro" style={{ color: 'var(--matcha-accent)' }}></i>
                        Nhận Diện Đề Thi & Bóc Tách OCR Đa Môn (Toán • Lí • Hóa • Văn)
                      </div>
                      <span className="ocr-paste-badge">
                        <i className="fa-solid fa-paste"></i> Hỗ trợ phím tắt <strong>Ctrl + V</strong> dán ảnh
                      </span>
                    </div>

                    {/* Multi-Domain Selector */}
                    <div className="domain-selector-bar">
                      <span style={{ fontSize: '0.8rem', fontWeight: 800, color: 'var(--matcha-dark)' }}>
                        <i className="fa-solid fa-layer-group"></i> Chọn Phân Loại Môn:
                      </span>
                      {[
                        { id: 'toan-thpt', label: '📐 Toán Học (LaTeX)' },
                        { id: 'vat-li-thpt', label: '⚡ Vật Lí (Chuẩn SI)' },
                        { id: 'hoa-hoc-thpt', label: '🧪 Hóa Học (IUPAC)' },
                        { id: 'ngu-van-thpt', label: '📖 Ngữ Văn (Đọc Hiểu)' }
                      ].map(dom => (
                        <button
                          key={dom.id}
                          className={`domain-pill-btn ${activeDomain === dom.id ? 'active' : ''}`}
                          onClick={() => {
                            setActiveDomain(dom.id);
                            const res = formatProblemBySubject(extractedMathText || '', dom.id);
                            setDetectedBadge(res.badge);
                          }}
                        >
                          {dom.label}
                        </button>
                      ))}
                    </div>

                    {/* Quick Demo Buttons for 4 Subjects */}
                    <div className="demo-buttons-bar">
                      <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)' }}>
                        Nạp nhanh đề mẫu chuẩn BGD:
                      </span>
                      <button className="btn-demo-subject" onClick={() => loadDemoQuestion('toan-thpt')}>
                        📐 Đề Toán Mẫu (Tiệm Cận)
                      </button>
                      <button className="btn-demo-subject" onClick={() => loadDemoQuestion('vat-li-thpt')}>
                        ⚡ Đề Vật Lí Mẫu (Khí Lí Tưởng)
                      </button>
                      <button className="btn-demo-subject" onClick={() => loadDemoQuestion('hoa-hoc-thpt')}>
                        🧪 Đề Hóa Mẫu (IUPAC Enthalpy)
                      </button>
                      <button className="btn-demo-subject" onClick={() => loadDemoQuestion('ngu-van-thpt')}>
                        📖 Đề Văn Mẫu (Đọc Hiểu & NLXH)
                      </button>
                    </div>

                    <input 
                      type="file" 
                      ref={fileInputRef} 
                      style={{ display: 'none' }}
                      accept="image/*,.pdf,.txt,.md,.docx"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          processFile(e.target.files[0]);
                        }
                      }}
                    />

                    <div 
                      className="upload-drop-area" 
                      style={{ marginTop: '12px' }}
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i>
                      <p style={{ fontWeight: 800, fontSize: '0.94rem', color: 'var(--matcha-dark)', marginBottom: '4px' }}>
                        Kéo thả ảnh bài tập (PNG, JPG) • Chụp màn hình rồi nhấn Ctrl + V • Hoặc tải PDF đề cương
                      </p>
                      <p style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                        ⚡ Tự động kết nối <strong>OCR Backend</strong> để bóc tách công thức Toán LaTeX, Vật lí SI, Hóa học IUPAC & Ngữ liệu Văn học
                      </p>
                      {isOcrLoading && (
                        <div style={{ marginTop: '10px', color: 'var(--matcha-primary)', fontWeight: 700, fontSize: '0.84rem' }}>
                          <i className="fa-solid fa-spinner fa-spin"></i> Đang phân tích qua OCR Backend...
                        </div>
                      )}
                    </div>

                    {/* Multi-Domain Verification & Correction Card */}
                    {(imagePreview || extractedMathText) && (
                      <div className="math-verify-card">
                        <div className="math-verify-header">
                          <div className="math-verify-title">
                            <i className="fa-solid fa-circle-check"></i>
                            Xác Nhận & Kiểm Chứng Đề Bài
                            <span className="badge-tag-aas badge-science" style={{ marginLeft: '8px', fontSize: '0.72rem' }}>
                              {detectedBadge}
                            </span>
                          </div>
                          <div style={{ display: 'flex', gap: '8px' }}>
                            {imagePreview && (
                              <button 
                                className="btn-aas btn-outline-aas"
                                style={{ padding: '6px 12px', fontSize: '0.76rem', borderColor: '#FFCDD2', color: '#C62828' }}
                                onClick={() => {
                                  setImagePreview('');
                                  setUploadedFile(null);
                                  triggerToast('Đã xóa ảnh chụp màn hình.');
                                }}
                              >
                                <i className="fa-solid fa-trash"></i> Xóa ảnh
                              </button>
                            )}
                            <button className="btn-verify-math" onClick={applyVerifiedMathToPrompt}>
                              <i className="fa-solid fa-arrow-down"></i> Đưa Vào Prompt Sư Phạm
                            </button>
                          </div>
                        </div>

                        {imagePreview && (
                          <div className="image-preview-wrapper">
                            <img src={imagePreview} alt="Ảnh đề bài" className="image-preview-thumb" />
                            <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>
                              <p><strong>Nguồn:</strong> {uploadedFile ? uploadedFile.name : 'Ảnh chụp màn hình'}</p>
                              <p><strong>Kích thước:</strong> {uploadedFile ? (uploadedFile.size / 1024).toFixed(1) + ' KB' : 'Clipboard buffer'}</p>
                              <span style={{ color: '#2E7D32', fontWeight: 700 }}>
                                <i className="fa-solid fa-check-double"></i> OCR Backend đã nhận diện thành công!
                              </span>
                            </div>
                          </div>
                        )}

                        <textarea 
                          className="builder-textarea"
                          style={{ minHeight: '100px', background: '#F1F8E9', borderColor: '#81C784', lineHeight: 1.6 }}
                          value={extractedMathText}
                          onChange={(e) => setExtractedMathText(e.target.value)}

                        />
                      </div>

                  </div>

                  {/* 5-PART MODERN PROMPT BUILDER (docs/Tieuchuanprompt.md) */}
                  <div className="prompt-builder-card">
                    <div className="builder-header">

                      {/* Component 1: Role */}
                      <div className="builder-field">
                        <label className="builder-label">
                          <i className="fa-solid fa-user-tie"></i> 1. Role (Vai trò chuyên môn)
                        </label>
                        <input 
                          type="text" 
                          className="builder-input" 
                          value={rolePrompt}
                          onChange={(e) => setRolePrompt(e.target.value)}
                          placeholder="Vai trò định vị cho AI..."
                        />

                      {/* Component 2: Context & Grade */}
                      <div className="builder-field">
                        <label className="builder-label">
                          <i className="fa-solid fa-bullseye"></i> 2. Context (Khối Lớp & Trình Độ)

                          <select 
                            className="builder-select" 
                            style={{ width: '110px' }}
                            value={gradeLevel}
                            onChange={(e) => setGradeLevel(Number(e.target.value))}
                          >
                            <option value={10}>Lớp 10</option>
                            <option value={11}>Lớp 11</option>
                            <option value={12}>Lớp 12</option>
                          </select>
                          <input 
                            type="text" 
                            className="builder-input" 
                            value={studentLevel}
                            onChange={(e) => setStudentLevel(e.target.value)}
                            placeholder="Mục tiêu điểm số hoặc trình độ..."
                          />
                        </div>
                      </div>
                    </div>

                    {/* Context Status Details */}
                    <div className="builder-field" style={{ marginBottom: '14px' }}>
                      <label className="builder-label">
                        <i className="fa-solid fa-compass"></i> Bối cảnh hiện tại (Đã nắm gì, chưa rõ gì)
                      </label>
                      <input 
                        type="text" 
                        className="builder-input" 
                        value={currentStatus}
                        onChange={(e) => setCurrentStatus(e.target.value)}
                        placeholder="Nêu rõ lỗ hổng kiến thức để AI hỗ trợ trúng đích..."
                      />
                    </div>

                    {/* Component 3: Task */}
                    <div className="builder-field" style={{ marginBottom: '14px' }}>
                      <label className="builder-label">
                        <i className="fa-solid fa-list-check"></i> 3. Task (Nhiệm vụ cụ thể)
                      </label>
                      <input 
                        type="text" 
                        className="builder-input" 
                        value={taskPrompt}
                        onChange={(e) => setTaskPrompt(e.target.value)}
                        placeholder="Hành động chính xác cần AI thực hiện..."
                      />
                    </div>

                    {/* Component 4: Constraints & Format */}
                    <div className="builder-field" style={{ marginBottom: '16px' }}>
                      <label className="builder-label">
                        <i className="fa-solid fa-ruler-combined"></i> 4. Constraints & Format (Ràng buộc & Định dạng)
                      </label>
                      <input 
                        type="text" 
                        className="builder-input" 
                        value={constraintsPrompt}
                        onChange={(e) => setConstraintsPrompt(e.target.value)}

                    </div>

                    {/* SPECIFIC TEXTBOOK TARGETING (Lấy đúng cuốn sách cụ thể) */}
                    <div className="specific-book-box">
                      <div className="book-box-header">
                        <div className="book-box-title">
                          <i className="fa-solid fa-book-bookmark"></i>
                          Dẫn Chứng Cuốn Sách Giáo Khoa Cụ Thể (Google Drive Cloud)
                        </div>

                          <a 
                            href={currentBookObject.drive} 
                            target="_blank" 
                            style={{ fontSize: '0.8rem', color: '#1B5E20', fontWeight: 700, textDecoration: 'underline' }}
                          >
                            Mở Thư Mục Chứa Cuốn Này <i className="fa-solid fa-arrow-up-right-from-square"></i>
                          </a>
                        )}
                      </div>

                      {availableBooks.length > 0 ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          <select 
                            className="builder-select"
                            value={selectedBookFile}
                            onChange={(e) => setSelectedBookFile(e.target.value)}
                          >
                            {availableBooks.map((b, bi) => (
                              <option key={bi} value={b.file}>
                                📖 {b.title} (File: {b.file})

                            <i className="fa-solid fa-circle-info"></i> Hệ thống sẽ ép AI trích xuất định lý và kiểm chứng lời giải trực tiếp từ cuốn sách này.
                          </p>
                        </div>
                      ) : (
                        <p style={{ fontSize: '0.84rem', color: '#558B2F' }}>
                          Sách giáo khoa Lớp {gradeLevel} chuẩn Bộ Giáo Dục: {DRIVE_LINKS_MAP[gradeLevel].url}

                    </div>

                    {/* Component 5: Cognitive Prompts Toggles */}
                    <div className="cognitive-toggles-box">
                      <div className="builder-label" style={{ marginBottom: '10px' }}>
                        <i className="fa-solid fa-brain"></i> 5. Kỹ Thuật Kích Hoạt Tư Duy Phản Biện (Cognitive Prompts)
                      </div>
                      <div className="toggle-grid">
                        <label className="toggle-item">
                          <input 
                            type="checkbox"

                        <label className="toggle-item">
                          <input 
                            type="checkbox"

                            onChange={(e) => setUseSocratic(e.target.checked)}
                          />
                          <span>Socratic Method (Gợi mở tư duy)</span>
                        </label>
                        <label className="toggle-item">
                          <input 
                            type="checkbox" 
                            checked={useFewShot}
                            onChange={(e) => setUseFewShot(e.target.checked)}

                        </label>
                        <label className="toggle-item">
                          <input 
                            type="checkbox" 
                            checked={useActiveRecall}
                            onChange={(e) => setUseActiveRecall(e.target.checked)}

                          <span>Active Recall (Câu hỏi tự vấn cuối)</span>
                        </label>
                      </div>
                    </div>

                    {/* Document-First Attachment (Đề bài hoặc Văn bản) */}
                    <div className="builder-field" style={{ marginBottom: '18px' }}>
                      <label className="builder-label">
                        <i className="fa-solid fa-file-lines"></i> Đề Bài / Bài Học Đã Bóc Tách (Document-First)
                      </label>
                      <textarea 
                        className="builder-textarea" 
                        value={docAttachment}
                        onChange={(e) => setDocAttachment(e.target.value)}
                        placeholder="Dán nội dung đề bài hoặc bấm 'Đưa Vào Prompt Sư Phạm' từ khu vực tải ảnh ở trên..."
                      />
                    </div>

                    {/* Live Output Preview */}
                    <div className="live-payload-section">
                      <div className="payload-header-bar">
                        <span className="payload-badge">LIVE PROMPT PREVIEW (TIÊU CHUẨN 5 KHUNG)</span>
                        <button 
                          className="btn-aas btn-primary-aas" 
                          style={{ padding: '4px 10px', fontSize: '0.78rem' }}
                          onClick={handleCopyPromptPayload}
                        >
                          <i className="fa-solid fa-copy"></i> Sao chép Prompt
                        </button>
                      </div>
                      <pre className="live-code-area">{generatedPromptPayload}</pre>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* VIEW 2: TỦ SÁCH SGK CLOUD */}

                <div style={{ marginBottom: '24px' }}>
                  <h2 style={{ fontFamily: 'Outfit, sans-serif', fontSize: '1.8rem', color: 'var(--matcha-dark)' }}>
                    📚 Tủ Sách SGK Điện Tử (Google Drive Cloud Storage)
                  </h2>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.92rem' }}>
                    Kho tài liệu SGK chuẩn mới có dung lượng hơn 2.03GB, được số hóa và phân luồng trên Google Drive nhằm tối ưu tốc độ và không làm phình kho mã nguồn Git.
                  </p>
                </div>

                <div className="drive-grid-cute">
                  {[10, 11, 12].map(grade => {
                    const item = DRIVE_LINKS_MAP[grade];
                    return (
                      <div key={grade} className="drive-card-cute">
                        <div>
                          <div style={{ 
                            width: '46px', 
                            height: '46px', 
                            borderRadius: '12px', 
                            background: grade === 10 ? '#E8F5E9' : grade === 11 ? '#E3F2FD' : '#FFF3E0',
                            color: grade === 10 ? '#2E7D32' : grade === 11 ? '#1565C0' : '#E65100',
                            display: 'flex', 
                            alignItems: 'center', 
                            justifyContent: 'center',
                            fontSize: '1.3rem',
                            marginBottom: '14px'
                          }}>
                            <i className="fa-solid fa-book-bookmark"></i>
                          </div>
                          <h3 style={{ fontFamily: 'Outfit, sans-serif', fontSize: '1.25rem', marginBottom: '6px' }}>
                            {item.title}
                          </h3>
                          <span style={{ 
                            fontSize: '0.74rem', 
                            fontWeight: 700, 
                            padding: '3px 10px', 
                            borderRadius: '20px',
                            background: 'var(--bg-matcha-light)',
                            color: 'var(--matcha-primary)',
                            display: 'inline-block',
                            marginBottom: '12px'
                          }}>
                            {item.badge}
                          </span>
                          <p style={{ fontSize: '0.86rem', color: 'var(--text-muted)', lineHeight: '1.6' }}>
                            Bao gồm đầy đủ sách giáo khoa và chuyên đề học tập các môn Toán, Vật lí, Hóa học, Sinh học, Ngữ văn, Lịch sử, Địa lí, Tin học, Công nghệ.
                          </p>
                        </div>

                        <div style={{ display: 'flex', gap: '8px', marginTop: '20px' }}>
                          <a 
                            href={item.url} 
                            target="_blank" 
                            className="btn-aas btn-primary-aas" 
                            style={{ flex: 1, justifyContent: 'center' }}
                          >
                            <i className="fa-solid fa-arrow-up-right-from-square"></i> Mở Drive Lớp {grade}
                          </a>
                          <button 
                            className="btn-aas btn-outline-aas"
                            onClick={() => {
                              navigator.clipboard.writeText(item.url);
                              triggerToast(`Đã sao chép link Drive Lớp ${grade}! 📂`);
                            }}
                          >
                            <i className="fa-solid fa-copy"></i>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VIEW 3: TIÊU CHUẨN PROMPT MẠNH (docs/Tieuchuanprompt.md) */}
            {activeTab === 'prompt-standard' && (
              <div className="standard-doc-card">
                <div style={{ borderBottom: '2px solid var(--border-color)', paddingBottom: '16px', marginBottom: '20px' }}>
                  <h2 style={{ fontFamily: 'Outfit, sans-serif', fontSize: '1.8rem', color: 'var(--matcha-dark)', marginBottom: '8px' }}>
                    📜 Bộ Tiêu Chuẩn Prompt Mạnh Trong Học Tập (Modern Prompt Engineering)
                  </h2>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.92rem' }}>
                    Trích xuất từ tài liệu <code>docs/Tieuchuanprompt.md</code> của dự án EduSkills-VN.
                  </p>
                </div>

                <div style={{ fontSize: '0.92rem', lineHeight: '1.7', color: 'var(--text-main)' }}>
                  <p style={{ marginBottom: '16px' }}>
                    Một prompt mạnh trong học tập hiện nay không phải là câu lệnh dài dòng, mà là câu lệnh có <strong>cấu trúc chặt chẽ</strong>, <strong>giảm thiểu ảo giác (hallucination)</strong> và <strong>buộc AI phải kích hoạt tư duy phản biện thay vì chỉ đưa ra câu trả lời có sẵn</strong>.
                  </p>

                  <h3 style={{ fontFamily: 'Outfit, sans-serif', fontSize: '1.2rem', color: 'var(--matcha-primary)', margin: '20px 0 10px 0' }}>
                    1. Khung 5 Thành Phần Cốt Lõi (Core Framework)
                  </h3>
                  <ul style={{ paddingLeft: '24px', marginBottom: '20px' }}>
                    <li style={{ marginBottom: '8px' }}><strong>Role (Vai trò chuyên môn):</strong> Định vị góc nhìn và trình độ chuyên môn cho AI (ví dụ: Gia sư Feynman, Giám khảo chấm thi, Chuyên gia IUPAC).</li>
                    <li style={{ marginBottom: '8px' }}><strong>Context (Bối cảnh & Trình độ):</strong> Nêu rõ cấp độ kiến thức của người học, mục tiêu cụ thể (ôn thi 8+, hiểu bản chất, nghiên cứu ViSEF) và những gì đã nắm vững.</li>
                    <li style={{ marginBottom: '8px' }}><strong>Task (Nhiệm vụ cụ thể):</strong> Hành động chính xác cần thực hiện. Tránh các câu chung chung như "giải thích X", thay vào đó dùng "phân tích cơ chế hoạt động của X, so sánh với Y và chỉ ra 3 lỗi sai phổ biến".</li>
                    <li style={{ marginBottom: '8px' }}><strong>Constraints & Format (Ràng buộc & Định dạng):</strong> Giới hạn độ dài, phong cách hành văn, bảng so sánh, công thức LaTeX ($...$), code có chú thích.</li>
                    <li style={{ marginBottom: '8px' }}><strong>Cognitive Prompts (Kỹ thuật kích hoạt tư duy):</strong>
                      <ul style={{ paddingLeft: '20px', marginTop: '6px' }}>
                        <li><em>Chain-of-Thought:</em> Giải thích từng bước (step-by-step) trước khi kết luận.</li>
                        <li><em>Socratic Method:</em> Đặt câu hỏi gợi mở để người học tự tư duy thay vì đưa ngay đáp án.</li>
                        <li><em>Few-shot:</em> Cung cấp 1-2 ví dụ mẫu chuẩn mực.</li>
                        <li><em>Active Recall:</em> Đặt câu hỏi kiểm tra tư duy ở cuối phản hồi.</li>
                      </ul>
                    </li>
                  </ul>
                </div>
              </div>
            )}
