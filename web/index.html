<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSkills-VN Matcha Hub 🍵🐾 | Nhận Diện Đề Toán LaTeX & Dẫn Chứng SGK Chuẩn BGD 2026</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- React 18 & ReactDOM & Babel for zero-build execution -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Offline Static Skills & Books Bundle -->
  <script src="./skills-data.js"></script>

  <style>
    :root {
      --bg-cream: #F7F9F6;
      --bg-card: #FFFFFF;
      --bg-matcha-subtle: #EEF4EF;
      --bg-matcha-light: #DFECE2;
      
      --matcha-primary: #385E47;
      --matcha-dark: #22382B;
      --matcha-accent: #588B69;
      --matcha-leaf: #7DAA8B;
      
      --honey-warm: #E29578;
      --honey-light: #FFDDD2;
      --strawberry-milk: #F7CAD0;
      
      --text-main: #1D2D24;
      --text-muted: #5C7164;
      --text-light: #8E9F94;
      --border-color: #E2EAE4;
      --border-focus: #588B69;
      
      --shadow-soft: 0 8px 30px rgba(56, 94, 71, 0.06);
      --shadow-hover: 0 12px 36px rgba(56, 94, 71, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Top Navbar */
    .top-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-title-group h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .brand-title-group p {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--matcha-accent);
    }

    .version-tag {
      background: var(--honey-light);
      color: #9C4221;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }

    .nav-tabs-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-tab-btn {
      background: transparent;
      border: 1.5px solid transparent;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .nav-tab-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .nav-tab-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 12px rgba(56, 94, 71, 0.2);
    }

    .btn-guide-pill {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .btn-guide-pill:hover {
      background: #FFCAB9;
      transform: translateY(-2px);
    }

    /* Layout */
    .app-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      flex: 1;
    }

    .skills-workspace-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 992px) {
      .skills-workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Sidebar: Catalog */
    .catalog-sidebar {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 90px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .search-box-cute {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box-cute i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--matcha-leaf);
      font-size: 0.95rem;
    }

    .search-input-cute {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .search-input-cute:focus {
      border-color: var(--matcha-primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(88, 139, 105, 0.15);
    }

    /* Category Pills - Clean Wrapping, zero ugly scrollbar */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      background: var(--bg-cream);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 12px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: var(--bg-matcha-subtle);
      color: var(--matcha-primary);
    }

    .pill-btn.active {
      background: var(--matcha-primary);
      color: white;
      border-color: var(--matcha-primary);
    }

    /* Skills Scrollable List */
    .skills-scroll-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skills-scroll-list::-webkit-scrollbar {
      width: 5px;
    }
    .skills-scroll-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .skill-card-item {
      background: var(--bg-cream);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-card-item:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
      transform: translateX(3px);
    }

    .skill-card-item.active {
      background: white;
      border-color: var(--matcha-primary);
      box-shadow: 0 4px 16px rgba(56, 94, 71, 0.1);
    }

    .skill-card-info h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--matcha-dark);
      margin-bottom: 2px;
    }

    .skill-card-info p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--honey-warm);
      font-weight: 600;
    }

    .badge-mini {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .badge-science { background: #E8F5E9; color: #2E7D32; }
    .badge-social { background: #EDE7F6; color: #512DA8; }
    .badge-tech { background: #E1F5FE; color: #0288D1; }
    .badge-meta { background: #FFF3E0; color: #E65100; }

    /* Workstation */
    .aas-workstation {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-soft);
    }

    .workstation-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-back-catalog {
      background: none;
      border: none;
      color: var(--matcha-accent);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-back-catalog:hover {
      background: var(--bg-matcha-subtle);
    }

    .badge-tag-aas {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .workstation-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--matcha-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .workstation-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 20px;
    }

    /* Action Bar */
    .aas-action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1.5px solid var(--border-color);
      margin-bottom: 28px;
    }

    .btn-aas {
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary-aas {
      background: var(--matcha-primary);
      color: white;
      border: 1.5px solid var(--matcha-primary);
    }

    .btn-primary-aas:hover {
      background: var(--matcha-dark);
      border-color: var(--matcha-dark);
      transform: translateY(-2px);
    }

    .btn-outline-aas {
      background: white;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline-aas:hover {
      background: var(--bg-matcha-subtle);
      border-color: var(--matcha-leaf);
    }

    .btn-honey-aas {
      background: var(--honey-light);
      border: 1.5px solid var(--honey-warm);
      color: #9C4221;
    }

    .btn-honey-aas:hover {
      background: #FFCAB9;
    }

    /* SMART DROPZONE & MATH OCR SECTION */
    .smart-upload-container {
      background: #FAFBF9;
      border: 2px dashed var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 28px;
      transition: all 0.2s;
    }

    .smart-upload-container.drag-over {
      background: #E8F5E9;
      border-color: var(--matcha-primary);
    }

    .upload-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .upload-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-drop-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: white;
      border: 1.5px dashed var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .upload-drop-area:hover {
      border-color: var(--matcha-primary);
      background: var(--bg-matcha-subtle);
    }

    .upload-drop-area i {
      font-size: 2.2rem;
      color: var(--matcha-accent);
      margin-bottom: 8px;
    }

    /* Image Preview & Extracted Math Verification Box */
    .math-verify-card {
      background: white;
      border: 1.5px solid #A5D6A7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 4px 16px rgba(46, 125, 50, 0.08);
    }

    .math-verify-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .math-verify-title {
      font-weight: 800;
      color: #1B5E20;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .image-preview-wrapper {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .image-preview-thumb {
      max-width: 140px;
      max-height: 100px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      object-fit: cover;
    }

    .btn-verify-math {
      background: #2E7D32;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-verify-math:hover {
      background: #1B5E20;
      transform: translateY(-2px);
    }

    /* 5-Part Modern Prompt Builder Card */
    .prompt-builder-card {
      background: #FAFCF9;
      border: 2px solid var(--matcha-leaf);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(56, 94, 71, 0.05);
    }

    .builder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .builder-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .builder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .builder-grid {
        grid-template-columns: 1fr;
      }
    }

    .builder-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .builder-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--matcha-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .builder-input, .builder-select {
      width: 100%;
      padding: 9px 12px;
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .builder-input:focus, .builder-select:focus, .builder-textarea:focus {
      border-color: var(--matcha-primary);
      box-shadow: 0 0 0 3px rgba(88, 139, 105, 0.12);
    }

    .builder-textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      resize: vertical;
    }

    /* Specific Textbook Citation Box */
    .specific-book-box {
      background: #E8F5E9;
      border: 1.5px solid #81C784;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .book-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .book-box-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: #1B5E20;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Cognitive Toggles */
    .cognitive-toggles-box {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 16px;
    }

    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .toggle-item input[type="checkbox"] {
      accent-color: var(--matcha-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Live Output Box */
    .live-payload-section {
      background: #1B2820;
      border-radius: var(--radius-md);
      padding: 16px;
      position: relative;
    }

    .payload-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .payload-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #A5D6A7;
      font-weight: 600;
    }

    .live-code-area {
      color: #E8F5E9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.6;
    }

    /* Interactive User Guide Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-cream);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .modal-close-btn:hover {
      background: #FFEbee;
      color: #C62828;
    }

    .guide-step-card {
      background: var(--bg-cream);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .guide-step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--matcha-primary);
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Cute Toast */
    .cute-toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--matcha-dark);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }

    .cute-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .footer-cute {
      text-align: center;
      padding: 24px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border-top: 1.5px solid var(--border-color);
      background: white;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Fallback static catalog if offline
    const DEFAULT_CATALOG = (typeof window !== 'undefined' && window.EDUSKILLS_CATALOG) ? window.EDUSKILLS_CATALOG : [];
    const BOOKS_DATABASE = (typeof window !== 'undefined' && window.EDUSKILLS_BOOKS) ? window.EDUSKILLS_BOOKS : {};

    const DRIVE_LINKS_MAP = {
      10: {
        grade: 10,
        title: 'Sách Giáo Khoa Lớp 10 (GDPT 2018)',
        url: 'https://drive.google.com/drive/folders/1H4BU2OMP1h5VJUtF8iQp9Dpmo40oHX6o?usp=drive_link',
        badge: 'Đầy đủ các bộ sách chuẩn GDPT 2018'
      },
      11: {
        grade: 11,
        title: 'Sách Giáo Khoa Lớp 11 (Bản Chuẩn Hóa BGD)',
        url: 'https://drive.google.com/drive/folders/1w8QOaRc_V5It9Xh0PvT_QwO_G7V22jZr?usp=drive_link',
        badge: 'Bản chuẩn hóa Bộ GD&ĐT'
      },
      12: {
        grade: 12,
        title: 'Sách Giáo Khoa Lớp 12 (SGK Thống Nhất 2026-2027)',
        url: 'https://drive.google.com/drive/folders/1I3h4nfdJTO5KdPsD4UWYdYJlMXQL1YwD?usp=drive_link',
        badge: 'Trọng tâm thi THPT Quốc Gia'
      }
    };

    // Math LaTeX Formatter Utility
    function formatMathProblem(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      
      // Fractions: e.g. (ax+b)/(cx+d) -> \frac{ax+b}{cx+d}
      text = text.replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '\\frac{$1}{$2}');
      text = text.replace(/([a-zA-Z0-9_]+)\/([a-zA-Z0-9_]+)/g, '\\frac{$1}{$2}');

      // Powers: e.g. x^2, x^3 -> x^{2}, x^{3}
      text = text.replace(/\^([0-9a-zA-Z]+)/g, '^{$1}');

      // Roots: e.g. sqrt(x + 1) -> \sqrt{x + 1}
      text = text.replace(/sqrt\(([^)]+)\)/gi, '\\sqrt{$1}');

      // Limits: e.g. lim x->+inf -> \lim_{x \to +\infty}
      text = text.replace(/lim\s*x\s*->\s*(\+?oo|\+?inf)/gi, '\\lim_{x \\to +\\infty}');
      text = text.replace(/lim\s*x\s*->\s*(-oo|-inf)/gi, '\\lim_{x \\to -\\infty}');

      // Vectors: e.g. vec(u) -> \vec{u}
      text = text.replace(/vec\(([a-zA-Z]+)\)/gi, '\\vec{$1}');

      // Integral: int_a^b -> \int_{a}^{b}
      text = text.replace(/int_([0-9a-zA-Z]+)\^([0-9a-zA-Z]+)/g, '\\int_{$1}^{$2}');

      // Format options A. B. C. D.
      text = text.replace(/([A-D])[\.\)]\s*/g, '\n**$1.** ');

      return text;
    }

    function App() {
      const [skills, setSkills] = useState(DEFAULT_CATALOG);
      const [selectedSkillId, setSelectedSkillId] = useState('toan-thpt');
      const [activeTab, setActiveTab] = useState('skills'); // skills | drive | prompt-standard | guide
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [shortlist, setShortlist] = useState({});
      const [toastMsg, setToastMsg] = useState('');
      const [showToast, setShowToast] = useState(false);
      const [showGuideModal, setShowGuideModal] = useState(false);

      // --- 5-Part Modern Prompt Builder State (docs/Tieuchuanprompt.md) ---
      const [rolePrompt, setRolePrompt] = useState('Gia sư Sư phạm Toán THPT chuẩn BGD 2026');
      const [gradeLevel, setGradeLevel] = useState(12);
      const [studentLevel, setStudentLevel] = useState('Khá - Giỏi (Mục tiêu 8.5+ THPT Quốc Gia)');
      const [currentStatus, setCurrentStatus] = useState('Đã nắm được phần lý thuyết cơ bản nhưng chưa vững phần bẫy trắc nghiệm');
      const [taskPrompt, setTaskPrompt] = useState('Phân tích bản chất, giải bài từng bước và chỉ ra 3 bẫy sai lầm kinh điển');
      const [constraintsPrompt, setConstraintsPrompt] = useState('Trình bày bằng LaTeX chuẩn ($...$), chia bảng so sánh, kiểm tra nghiệm');
      
      // Cognitive Toggles
      const [useCoT, setUseCoT] = useState(true);
      const [useSocratic, setUseSocratic] = useState(true);
      const [useFewShot, setUseFewShot] = useState(false);
      const [useActiveRecall, setUseActiveRecall] = useState(true);
      
      // Specific Book Selection
      const [selectedBookFile, setSelectedBookFile] = useState('');

      // Document / Exercise Attachment & Upload
      const [docAttachment, setDocAttachment] = useState('');
      const [uploadedFile, setUploadedFile] = useState(null);
      const [imagePreview, setImagePreview] = useState('');
      const [extractedMathText, setExtractedMathText] = useState('');
      const [isDragOver, setIsDragOver] = useState(false);
      const fileInputRef = useRef(null);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2600);
      };

      // Load Catalog from API (with fallback)
      useEffect(() => {
        fetch('/api/skills')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setSkills(data);
            }
          })
          .catch(() => {
            if (window.EDUSKILLS_CATALOG) setSkills(window.EDUSKILLS_CATALOG);
          });

        try {
          const saved = localStorage.getItem('eduskills_shortlist');
          if (saved) setShortlist(JSON.parse(saved));
        } catch (e) {}
      }, []);

      const selectedSkill = useMemo(() => {
        return skills.find(s => s.id === selectedSkillId) || skills[0] || {};
      }, [skills, selectedSkillId]);

      // Get available specific books for current skill and grade
      const availableBooks = useMemo(() => {
        const skillBooks = BOOKS_DATABASE[selectedSkill.id] || BOOKS_DATABASE['toan-thpt'] || {};
        return skillBooks[gradeLevel] || [];
      }, [selectedSkill, gradeLevel]);

      // Set default book file when grade or skill changes
      useEffect(() => {
        if (availableBooks.length > 0) {
          setSelectedBookFile(availableBooks[0].file);
        } else {
          setSelectedBookFile('');
        }
      }, [availableBooks]);

      const currentBookObject = useMemo(() => {
        return availableBooks.find(b => b.file === selectedBookFile) || availableBooks[0] || null;
      }, [availableBooks, selectedBookFile]);

      // Auto update role prompt when skill changes
      useEffect(() => {
        if (!selectedSkill.name) return;
        const subjectMap = {
          'toan-thpt': 'Chuyên gia Sư phạm Toán THPT chuẩn GDPT 2018 & Đề thi BGD 2026',
          'vat-li-thpt': 'Gia sư Vật lí THPT chuyên sâu Vật lí nhiệt, Khí lí tưởng & Đơn vị SI',
          'hoa-hoc-thpt': 'Chuyên gia Hóa học IUPAC 100% tiếng Anh chuẩn SGK mới',
          'sinh-hoc-thpt': 'Cố vấn Sinh học THPT chuyên sâu Di truyền phân tử & Phả hệ',
          'ngu-van-thpt': 'Giáo viên Ngữ văn THPT chuyên luyện Đọc hiểu ngoài SGK & NLXH 200 chữ',
          'giai-chi-tiet': 'Gia sư Sư phạm Đa Tầng Socrates (Khơi mở tư duy, không lộ đáp số ngay)',
          'tao-quiz-bgd': 'Chuyên gia khảo thí thiết kế đề thi 3 phần chuẩn QĐ 764/QĐ-BGDĐT',
          'slide-thuyet-trinh': 'Presentation Architect chuyên thiết kế slide Marp 16:9 chuẩn sư phạm',
          'tomtat-mindmap': 'Chuyên gia Siêu Trí Nhớ & Sơ đồ tư duy Mermaid Cornell 60 giây',
          'luan-an-nghiencuu': 'Cố vấn Nghiên cứu Khoa học Kỹ thuật THPT (Hội thi ViSEF)'
        };
        setRolePrompt(subjectMap[selectedSkill.id] || `Chuyên gia giảng dạy môn ${selectedSkill.name} THPT`);
      }, [selectedSkill]);

      // Filtered Skills
      const filteredSkills = useMemo(() => {
        return skills.filter(item => {
          const matchCat = selectedCategory === 'all' || item.category === selectedCategory;
          const matchQuery = (item.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                             (item.description || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                             (item.id && item.id.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchCat && matchQuery;
        });
      }, [skills, selectedCategory, searchQuery]);

      // Generate Standardized 5-Part Prompt with EXACT BOOK GROUNDING
      const generatedPromptPayload = useMemo(() => {
        const driveInfo = DRIVE_LINKS_MAP[gradeLevel] || DRIVE_LINKS_MAP[12];
        const bookTitle = currentBookObject ? currentBookObject.title : `Sách Giáo Khoa Lớp ${gradeLevel}`;
        const bookFile = currentBookObject ? currentBookObject.file : 'Tài liệu SGK chuẩn';
        const bookDrive = currentBookObject ? currentBookObject.drive : driveInfo.url;
        
        let p = `# [EDUSKILLS-VN STANDARDIZED PROMPT - CHUẨN TIEUCHUANPROMPT.MD]\n\n`;
        p += `[Vai trò]: ${rolePrompt}.\n\n`;
        p += `[Bối cảnh]: Tôi là học sinh Lớp ${gradeLevel}, trình độ "${studentLevel}". Hiện tại ${currentStatus}.\n\n`;
        p += `[Yêu cầu]: Hãy thực hiện nhiệm vụ môn ${selectedSkill.name || selectedSkill.id}:\n`;
        p += `- ${taskPrompt}.\n\n`;
        
        p += `[Ràng buộc & Định dạng]:\n`;
        p += `- ${constraintsPrompt}.\n`;
        p += `- Tuân thủ nghiêm ngặt chuẩn kiến thức GDPT 2018 và định dạng đề thi BGD 2026-2027.\n\n`;
        
        p += `[Kỹ thuật kích hoạt tư duy (Cognitive Prompts)]:\n`;
        if (useCoT) p += `- Chain-of-Thought: Giải thích bản chất từng bước (step-by-step) trước khi kết luận.\n`;
        if (useSocratic) p += `- Socratic Method: Đặt câu hỏi gợi mở để người học tự động não, không đưa ngay đáp số thô.\n`;
        if (useFewShot) p += `- Few-shot: Minh họa bằng 1 ví dụ tương đương theo phong cách chuẩn mực.\n`;
        if (useActiveRecall) p += `- Active Recall: Ở cuối bài giải, hãy đặt 1 câu hỏi kiểm tra tư duy hoặc bài tập tương tự để tôi tự đánh giá mức độ hiểu sâu.\n`;

        p += `\n[Nguồn Sách Giáo Khoa Cụ Thể Cần Đối Chiếu & Dẫn Chứng]:\n`;
        p += `- Tên cuốn sách: ${bookTitle}\n`;
        p += `- File tài liệu gốc: ${bookFile}\n`;
        p += `- Thư mục Google Drive trực tiếp: ${bookDrive}\n`;
        p += `- Yêu cầu xác thực: Hãy trích dẫn chính xác định lý, công thức hoặc trang tài liệu từ cuốn sách trên để bảo chứng cho kết quả.\n`;

        p += `\n[Quy Trình Kiểm Chứng Toán Học & Bản Chất Khoa Học]:\n`;
        p += `1. Xác định tập xác định D và điều kiện có nghĩa trước khi biến đổi.\n`;
        p += `2. Cảnh báo các bẫy phòng thi kinh điển (quên điều kiện, nhầm dấu, chia cho 0).\n`;
        p += `3. Thử lại đáp số bằng phép thế ngược hoặc phương pháp hình học.\n`;

        if (docAttachment.trim()) {
          p += `\n[Tài Liệu / Đề Bài Đã Được Nhận Diện & Định Dạng LaTeX]:\n${docAttachment.trim()}\n`;
        }

        return p;
      }, [rolePrompt, gradeLevel, studentLevel, currentStatus, taskPrompt, constraintsPrompt, useCoT, useSocratic, useFewShot, useActiveRecall, currentBookObject, docAttachment, selectedSkill]);

      // --- Handle File & Image Upload ---
      const processFile = (file) => {
        if (!file) return;
        setUploadedFile(file);

        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            setImagePreview(e.target.result);
            // Simulated Math Recognizer: provides clean LaTeX starter from problem
            const demoMath = `Cho hàm số $y = \\frac{2x - 1}{x + 1}$.\n1. Tìm tập xác định $D$ và các đường tiệm cận (đứng, ngang).\n2. Tìm các điểm cực trị và vẽ bảng biến thiên của hàm số.\nA. Tiệm cận đứng $x = -1$, tiệm cận ngang $y = 2$\nB. Tiệm cận đứng $x = 1$, tiệm cận ngang $y = -1$\nC. Tiệm cận đứng $x = 2$, tiệm cận ngang $y = 1$\nD. Hàm số không có tiệm cận`;
            setExtractedMathText(demoMath);
            triggerToast(`Đã nhận diện ảnh đề bài "${file.name}"! 📷🐾`);
          };
          reader.readAsDataURL(file);
        } else {
          // Document / Text / PDF
          setImagePreview('');
          const reader = new FileReader();
          reader.onload = (e) => {
            const rawContent = e.target.result;
            const formatted = formatMathProblem(rawContent);
            setExtractedMathText(formatted);
            triggerToast(`Đã đọc nội dung tài liệu "${file.name}"! 📄`);
          };
          reader.readAsText(file);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      // Transfer verified math exercise into Prompt
      const applyVerifiedMathToPrompt = () => {
        if (!extractedMathText.trim()) return;
        setDocAttachment(extractedMathText.trim());
        triggerToast('Đã xác nhận & chuyển đề bài LaTeX vào Prompt! ✅');
      };

      // Load Demo Math Question
      const loadDemoMath = () => {
        const sample = `Câu 38: Cho hình lăng trụ tam giác đều $ABC.A'B'C'$ có cạnh đáy bằng $a$, cạnh bên bằng $2a$. Tính khoảng cách $d$ giữa hai đường thẳng $AB'$ và $BC'$.\nA. $d = \\frac{a\\sqrt{21}}{7}$\nB. $d = \\frac{a\\sqrt{3}}{2}$\nC. $d = \\frac{2a\\sqrt{5}}{5}$\nD. $d = a\\sqrt{2}`;
        setExtractedMathText(sample);
        setDocAttachment(sample);
        triggerToast('Đã nạp bài toán mẫu hình không gian Oxyz! 📐');
      };

      // --- Offline Downloads & Copies ---
      const handleDownloadSkillMd = () => {
        try {
          const content = selectedSkill.rawContent || `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${selectedSkill.id || 'skill'}.SKILL.md`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          triggerToast(`Đã tải file ${selectedSkill.id}.SKILL.md về máy! 💾🐾`);
        } catch (e) {
          triggerToast(`Lỗi: ${e.message}`);
        }
      };

      const handleCopyPromptPayload = async () => {
        try {
          await navigator.clipboard.writeText(generatedPromptPayload);
          triggerToast(`Đã sao chép Prompt chuẩn Tieuchuanprompt.md! 📋✨`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      const handleCopyFullContent = async () => {
        try {
          let text = selectedSkill.rawContent || '';
          if (!text) {
            text = `# ${selectedSkill.name}\n\n${selectedSkill.description}\n\n${generatedPromptPayload}`;
          } else {
            text += `\n\n========================================\n[PROMPT SƯ PHẠM ĐÍNH KÈM TỪ EDUSKILLS-VN]:\n${generatedPromptPayload}\n========================================\n`;
          }
          await navigator.clipboard.writeText(text);
          triggerToast(`Đã sao chép toàn bộ Master Playbook ${selectedSkill.id}.SKILL.md! 🍵`);
        } catch (e) {
          triggerToast(`Lỗi sao chép: ${e.message}`);
        }
      };

      return (
        <div>
          {/* Top Navbar */}
          <header className="top-navbar">
            <div className="brand-section" onClick={() => setActiveTab('skills')}>
              <svg className="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="#588B69" />
                <path d="M28 35L36 18L44 32" fill="#E29578" />
                <path d="M72 35L64 18L56 32" fill="#E29578" />
                <circle cx="50" cy="52" r="32" fill="#FFFFFF" />
                <ellipse cx="40" cy="48" rx="4" ry="5" fill="#22382B" />
                <ellipse cx="60" cy="48" rx="4" ry="5" fill="#22382B" />
                <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF" />
                <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF" />
                <path d="M48 54L52 54L50 57Z" fill="#E29578" />
                <path d="M46 59C48 61 52 61 54 59" stroke="#22382B" strokeWidth="2" strokeLinecap="round" />
                <ellipse cx="33" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <ellipse cx="67" cy="53" rx="4" ry="2.5" fill="#FFDDD2" />
                <path d="M38 72H62C62 72 60 84 50 84C40 84 38 72 38 72Z" fill="#385E47" />
                <ellipse cx="50" cy="72" rx="12" ry="3" fill="#7DAA8B" />
              </svg>
              <div className="brand-title-group">
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <h1>EduSkills-VN</h1>
                  <span className="version-tag">v0.1.2-beta</span>
                </div>
                <p>🍵 Matcha Mèo Ú • Nhận Diện Đề Toán & Dẫn Chứng SGK Chuẩn</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="nav-tabs-group">
              <button 
                className={`nav-tab-btn ${activeTab === 'skills' ? 'active' : ''}`}
                onClick={() => setActiveTab('skills')}
              >
                <i className="fa-solid fa-graduation-cap"></i> 16 Kỹ Năng THPT
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'drive' ? 'active' : ''}`}
                onClick={() => setActiveTab('drive')}
              >
                <i className="fa-brands fa-google-drive"></i> Tủ Sách SGK Cloud
              </button>
              <button 
                className={`nav-tab-btn ${activeTab === 'prompt-standard' ? 'active' : ''}`}
                onClick={() => setActiveTab('prompt-standard')}
              >
                <i className="fa-solid fa-scroll"></i> Tiêu Chuẩn Prompt Mạnh
              </button>
              <button 
                className="btn-guide-pill"
                onClick={() => setShowGuideModal(true)}
              >
                <i className="fa-solid fa-circle-question"></i> Hướng Dẫn Sử Dụng
              </button>
            </div>
          </header>

          {/* Main App Container */}
          <main className="app-container">
            {/* VIEW 1: SKILLS & WORKSTATION */}
            {activeTab === 'skills' && (
              <div className="skills-workspace-grid">
                {/* Left: Sidebar Catalog */}
                <aside className="catalog-sidebar">
                  <div className="search-box-cute">
                    <i className="fa-solid fa-magnifying-glass"></i>
                    <input 
                      type="text" 
                      className="search-input-cute" 
                      placeholder="Tìm môn học (/toan, /hoa, /quiz)..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>

                  {/* Category Pills - Clean Wrapping */}
                  <div className="category-pills">
                    {[
                      { id: 'all', label: 'Tất cả (16)' },
                      { id: 'khoa-hoc-tu-nhien', label: 'Tự nhiên' },
                      { id: 'khoa-hoc-xa-hoi', label: 'Xã hội' },
                      { id: 'ngon-ngu-cong-nghe', label: 'Công nghệ' },
                      { id: 'meta-tools', label: 'Meta-tools' }
                    ].map(cat => (
                      <button 
                        key={cat.id} 
                        className={`pill-btn ${selectedCategory === cat.id ? 'active' : ''}`}
                        onClick={() => setSelectedCategory(cat.id)}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>

                  {/* Skills Scrollable List */}
                  <div className="skills-scroll-list">
                    {filteredSkills.map(skill => {
                      const isSelected = skill.id === selectedSkill.id;
                      const isFav = !!shortlist[skill.id];
                      return (
                        <div 
                          key={skill.id} 
                          className={`skill-card-item ${isSelected ? 'active' : ''}`}
                          onClick={() => setSelectedSkillId(skill.id)}
                        >
                          <div className="skill-card-info">
                            <h4>{skill.name}</h4>
                            <p>@{skill.id} {isFav ? '💖' : ''}</p>
                          </div>
                          <span className={`badge-mini ${
                            skill.category === 'khoa-hoc-tu-nhien' ? 'badge-science' :
                            skill.category === 'khoa-hoc-xa-hoi' ? 'badge-social' :
                            skill.category === 'ngon-ngu-cong-nghe' ? 'badge-tech' : 'badge-meta'
                          }`}>
                            {skill.category ? skill.category.split('-')[0].toUpperCase() : 'SKILL'}
                          </span>
                        </div>
                      );
